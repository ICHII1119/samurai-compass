<style>
:root {
  --bg:       #1a1a1f;

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }

body {

}

.page-header { text-align:center; padding:2rem 1.2rem 1.2rem; border-bottom:1px solid var(--border) }
.logo-img { width:48px; height:48px; object-fit:contain; margin-bottom:.5rem }
.page-title { font-family:var(--font-b); font-size:1rem; letter-spacing:.2em; color:var(--gold) }

.rank-section { text-align:center; padding:1.8rem 1.2rem 1rem }
.rank-mon { width:80px; height:80px; margin:0 auto 1rem }
.rank-mon svg { width:100%; height:100% }
.rank-name { font-family:var(--font-b); font-size:2rem; font-weight:700; color:var(--cream); letter-spacing:.1em; line-height:1 }
.rank-sub  { font-size:.78rem; color:var(--muted); letter-spacing:.15em; margin-top:.4rem }
.rank-desc { font-size:.85rem; color:var(--cream2); margin-top:.8rem; line-height:1.7; max-width:320px; margin-left:auto; margin-right:auto }

.progress-section { padding:0 1.2rem 1.4rem; max-width:480px; margin:0 auto }
.progress-label { display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-bottom:.5rem }
.progress-count { color:var(--gold); font-weight:600 }
.progress-bar-bg { height:6px; background:var(--bg3); border-radius:100px; overflow:hidden }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--gold2),var(--gold)); border-radius:100px; transition:width .6s ease }

.stamp-section { padding:0 1rem 1.5rem; max-width:480px; margin:0 auto }
.stamp-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:.45rem }
.stamp-slot {
  aspect-ratio:1; border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; border:1.5px solid rgba(201,168,76,.2); background:var(--bg2);
  cursor:default; overflow:hidden;
}
.stamp-slot.stamped  { border-color:var(--gold2); background:var(--gold-dim) }
.stamp-slot.today-slot { border-color:var(--gold); background:var(--gold-dim); box-shadow:0 0 0 2px rgba(201,168,76,.15) }
.stamp-slot.future   { opacity:.35 }
.stamp-day-num { font-size:.58rem; color:var(--muted); line-height:1; margin-bottom:.15rem }
.stamp-slot.stamped .stamp-day-num    { color:rgba(201,168,76,.5) }
.stamp-slot.today-slot .stamp-day-num { color:var(--gold) }
.stamp-seal { font-family:var(--font-b); font-size:1.1rem; font-weight:700; color:var(--gold); line-height:1 }

.reflection-section { max-width:480px; margin:0 auto; padding:0 1.2rem 1.5rem }
.reflection-card {
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--r);

}
.reflection-card::before {

.reflection-day-label { font-size:.7rem; letter-spacing:.2em; color:var(--muted); margin-bottom:.3rem }

.btn-submit:hover { opacity:.88 }
.btn-submit:disabled { opacity:.4; cursor:not-allowed }

  text-align:center; padding:1.2rem; background:var(--bg2);

.completion-mon { width:100px; height:100px; margin:0 auto 1.2rem }
.completion-title { font-family:var(--font-b); font-size:1.8rem; font-weight:700; color:var(--gold); letter-spacing:.05em; margin-bottom:.5rem }
.completion-rank  { font-family:var(--font-b); font-size:2.8rem; font-weight:700; color:var(--cream); letter-spacing:.1em; margin-bottom:.8rem }
.completion-desc  { font-size:.92rem; color:var(--cream2); line-height:1.8 }
.completion-divider { margin:1.5rem auto; width:60px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent) }

.loading-screen { text-align:center; padding:4rem 1.5rem; color:var(--muted); font-size:.9rem }
.error-screen   { text-align:center; padding:3rem 1.5rem; color:var(--muted) }

@keyframes stampIn {
  0%   { transform:scale(2) rotate(-15deg); opacity:0 }
  60%  { transform:scale(.9) rotate(-6deg); opacity:1 }
  100% { transform:scale(1) rotate(-8deg); opacity:1 }
}
.stamp-anim { animation:stampIn .4s cubic-bezier(.22,1,.36,1) forwards }

@keyframes fadeSlideUp {
  from { opacity:0; transform:translateY(16px) }

.fade-up { animation:fadeSlideUp .5s ease forwards }

.conv-musashi { background:rgba(139,26,26,.07); border:1px solid rgba(201,168,76,.2) }

.conv-followup-wrap { padding:.85rem .95rem; background:rgba(201,168,76,.03); border:1px solid rgba(201,168,76,.18); border-radius:10px; margin-top:.1rem }
</style>

    ]);
    practiceData = doc.exists ? doc.data() : { userId, entries: [], cycle: 1 };
    liteSpirit = liteDoc.exists ? (liteDoc.data().spirit || null) : null;
    (practiceData.entries || []).forEach(e => stampedDays.add(e.day));
    render();
  } catch(e) {
    console.error(e);
    showError(S.error);
  }
}

function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  const count    = stampedDays.size;
  const completed = count >= 21;
  const rank     = RANKS[completed ? 1 : 0];

  document.getElementById('rank-mon').innerHTML   = rank.mon;
  document.getElementById('rank-name').textContent = rank.name;
  document.getElementById('rank-sub').textContent  = rank.sub;
  document.getElementById('rank-desc').textContent = rank.desc;

  document.getElementById('stamped-count').textContent = count;
  document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

  renderGrid();

  if (completed) {
    showCompletion();
  } else if (todayDay && todayDay >= 1 && todayDay <= 21) {
    renderReflection(todayDay);
  } else {
    document.getElementById('reflection-area').innerHTML = `
      <div class="already-stamped">
        <div style="font-size:.82rem;color:var(--muted)">
          Open the link from your daily morning notification<br>to record today's practice.
        </div>
      </div>`;
  }
}

function renderGrid() {
  const grid = document.getElementById('stamp-grid');
  grid.innerHTML = '';
  for (let d = 1; d <= 21; d++) {
    const el = document.createElement('div');
    const isStamped = stampedDays.has(d);
    const isToday   = d === todayDay;
    el.className = 'stamp-slot' + (isStamped ? ' stamped' : isToday ? ' today-slot' : ' future');
    const dayLabel = `<div class="stamp-day-num">${d}</div>`;
    if (isStamped) {
      el.innerHTML = dayLabel + `<div class="stamp-seal">練</div>`;
    } else if (isToday) {
      el.innerHTML = dayLabel + `<div style="font-size:.75rem;color:var(--gold);font-weight:600">Today</div>`;
    } else {
      el.innerHTML = dayLabel;
    }
    grid.appendChild(el);
  }
}

function renderReflection(day) {
  const area      = document.getElementById('reflection-area');
  const savedMemo = (practiceData.memos || {})[String(day)]?.text || '';
  const P = S.practice;

  if (stampedDays.has(day)) {
    const entry = (practiceData.entries || []).find(e => e.day === day);
    const spiritKey = liteSpirit || null;
    const tip = spiritKey ? (TIPS_COMPACT[spiritKey] || [])[day - 1] : null;
    const musashiRepliesDay = (practiceData.musashiReplies || {})[String(day)];
    const adminComment = (practiceData.adminComments || []).filter(c => Number(c.day) === day).slice(-1)[0];
    const replies = musashiRepliesDay?.reply
      ? musashiRepliesDay
      : adminComment
        ? { reply: adminComment.text, ...(musashiRepliesDay || {}) }
        : null;

    const challengeBlock = tip ? `
      <div class="conv-block conv-challenge">
        <div class="conv-label">Today's Challenge</div>
        <div style="font-weight:600;margin-bottom:.22rem;color:var(--cream)">${tip.t}</div>
        <div style="color:var(--cream2)">${tip.a}</div>
      </div>` : '';

    const participantBlock = entry?.text ? `
      <div class="conv-block conv-participant">
        <div class="conv-label">Your Reflection</div>
        <div style="color:var(--cream2)">${entry.text.replace(/\n/g,'<br>')}</div>
      </div>` : '';

    let musashiSection = '';
    if (replies?.reply) {
      const musashiFirstBlock = `
        <div class="conv-block conv-musashi">
          <div class="conv-label">⚔ From Musashi</div>
          <div style="color:var(--cream2)">${replies.reply.replace(/\n/g,'<br>')}</div>
        </div>`;
      if (!replies.followUpText) {
        musashiSection = musashiFirstBlock + `
        <div class="conv-followup-wrap" id="followup-block-${day}">
          <div class="conv-label">Report what you did</div>
          <div style="font-size:.75rem;color:var(--muted);margin-bottom:.5rem">Share what you actually tried after reading Musashi's words. Even something small counts.</div>
          <textarea class="reflection-textarea" id="followup-text-${day}" rows="3" placeholder="e.g. I paused for a breath before replying to someone."></textarea>
          <button class="btn-submit" id="followup-btn-${day}" onclick="submitFollowUp(${day})" style="margin-top:.65rem">
            ⚔️ Report to Musashi
          </button>
          <div id="followup-result-${day}" style="text-align:center;font-size:.78rem;margin-top:.4rem;color:var(--muted)"></div>
        </div>`;
      } else {
        const followUpBlock = `
        <div class="conv-block conv-participant">
          <div class="conv-label">Your Report</div>
          <div style="color:var(--cream2)">${replies.followUpText.replace(/\n/g,'<br>')}</div>
        </div>`;
        const musashiSecondBlock = replies.musashiFollowUp ? `
        <div class="conv-block conv-musashi">
          <div class="conv-label">⚔ From Musashi (reply)</div>
          <div style="color:var(--cream2)">${replies.musashiFollowUp.replace(/\n/g,'<br>')}</div>
        </div>` : '';
        musashiSection = musashiFirstBlock + followUpBlock + musashiSecondBlock;
      }
    }

    area.innerHTML = `
      <div class="reflection-card fade-up">
        <div class="reflection-day-label">DAY ${day} · ${P.dayComplete(day)}</div>
        <div class="conv-thread">
          ${challengeBlock}${participantBlock}${musashiSection}
        </div>
      </div>
      ${memoBlock(day, savedMemo)}`;
    return;
  }

  area.innerHTML = `
    <div class="reflection-card fade-up">
      <div class="reflection-day-label">DAY ${day} · ${P.reflectionLabel}</div>
      <div class="reflection-title">${P.reflectionLabel}</div>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:.5rem">${P.reflectionNote}</div>
      <textarea class="reflection-textarea" id="reflection-text"
        placeholder="${P.reflectionPlaceholder}" rows="4"></textarea>
      <button class="btn-submit" id="submit-btn" onclick="submitPractice(${day})">
        ⚔️ ${P.submitBtn}
      </button>
    </div>
    ${memoBlock(day, savedMemo)}`;
}

function memoBlock(day, savedText) {
  const P = S.practice;
  return `
    <div class="reflection-card fade-up" style="margin-top:1rem;border-color:rgba(201,168,76,.1)">
      <div class="reflection-day-label">${P.memoLabel}</div>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:.6rem">${P.memoNote}</div>
      <textarea class="reflection-textarea" id="memo-text" rows="3"
        placeholder="${P.memoPlaceholder}">${savedText}</textarea>
      <button class="btn-submit" id="memo-btn" onclick="saveMemo(${day})"
        style="margin-top:.7rem;background:linear-gradient(135deg,#2a3a2a,#3a5a3a)">
        ${P.memoBtn}
      </button>
      <div id="memo-result" style="text-align:center;font-size:.8rem;margin-top:.5rem;color:var(--muted)"></div>
    </div>`;
}

async function saveMemo(day) {
  const P = S.practice;
  const text   = document.getElementById('memo-text')?.value ?? '';
  const btn    = document.getElementById('memo-btn');
  const result = document.getElementById('memo-result');
  btn.disabled = true;
  btn.textContent = P.memoSaving;
  try {
    await db.collection('practices').doc(userId).set({
      memos: { [String(day)]: { text, updatedAt: new Date().toISOString() } }
    }, { merge: true });
    if (!practiceData.memos) practiceData.memos = {};
    practiceData.memos[String(day)] = { text };
    result.style.color = 'var(--gold)';
    result.textContent = P.memoDone;
    setTimeout(() => { result.textContent = ''; }, 2500);
  } catch(e) {
    console.error(e);
    result.style.color = '#c06060';
    result.textContent = P.memoError;
  } finally {
    btn.disabled = false;
    btn.textContent = P.memoBtn;
  }
}

async function submitFollowUp(day) {
  const text = (document.getElementById(`followup-text-${day}`)?.value || '').trim();
  if (!text) { alert('Please enter what you did.'); return; }
  const btn    = document.getElementById(`followup-btn-${day}`);
  const result = document.getElementById(`followup-result-${day}`);
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
  if (result) result.textContent = 'Musashi is composing a reply…';
  try {
    const r = await fetch(FOLLOW_UP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, day, text })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed');
    if (!practiceData.musashiReplies) practiceData.musashiReplies = {};
    if (!practiceData.musashiReplies[String(day)]) practiceData.musashiReplies[String(day)] = {};
    practiceData.musashiReplies[String(day)].followUpText = text;
    practiceData.musashiReplies[String(day)].musashiFollowUp = data.musashiFollowUp || '';
    renderReflection(day);
  } catch(e) {
    if (result) result.textContent = 'Send failed: ' + e.message;
    if (btn) { btn.disabled = false; btn.textContent = '⚔️ Report to Musashi'; }
  }
}

async function submitPractice(day) {
  const P = S.practice;
  const textEl = document.getElementById('reflection-text');
  const text   = textEl?.value?.trim() || '';
  const btn    = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = P.submitting; }

  const entry = { day, text, timestamp: new Date().toISOString(), cycle: practiceData.cycle || 1 };

  try {
    await db.collection('practices').doc(userId).set({
      userId,
      cycle: practiceData.cycle || 1,
      entries: firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    stampedDays.add(day);
    if (!practiceData.entries) practiceData.entries = [];
    practiceData.entries.push({ ...entry, timestamp: new Date() });

    const count = stampedDays.size;
    document.getElementById('stamped-count').textContent = count;
    document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

    renderGrid();
    if (count >= 21) {
      await db.collection('practices').doc(userId).set({ rank: '10kyu' }, { merge: true });
      setTimeout(showCompletion, 600);
    } else {
      renderReflection(day);
    }
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = `⚔️ ${S.practice.submitBtn}`; }
    alert(S.practice.submitError);
  }
}

function showCompletion() {
  const P = S.practice;
  document.getElementById('completion-screen').innerHTML = `
    <div class="fade-up">
      <div class="completion-mon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#c9a84c" stroke-width="3"/>
          <circle cx="50" cy="50" r="38" stroke="#c9a84c" stroke-width="1" opacity=".4"/>
          <circle cx="50" cy="50" r="30" stroke="#c9a84c" stroke-width="1" opacity=".2"/>
          <text x="50" y="65" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a84c" font-weight="bold">十</text>
        </svg>
      </div>
      <div class="completion-title">${P.programComplete}</div>
      <div class="completion-rank">10th Kyu</div>
      <div class="completion-divider"></div>
      <div class="completion-desc">
        You kept going.<br>
        That alone makes you a samurai.<br><br>
        The gates of the dojo are now open.<br>
        Your real training begins.
      </div>
      <div style="margin-top:1.5rem">
        <a href="report.html?uid=${userId}"
          style="display:inline-block;background:var(--gold);color:#1a1208;border-radius:100px;padding:.8rem 2rem;font-weight:600;text-decoration:none;font-size:.95rem">
          ${P.viewReport}
        </a>
      </div>
    </div>`;
  document.getElementById('completion-screen').classList.add('visible');
  document.getElementById('reflection-area').innerHTML = '';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-msg').innerHTML = msg;
}

init();
</script>
</body>
</html>
