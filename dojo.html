<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道場の記録 — SAMURAI in You</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #1a1a1f;
  --bg2:       #222228;
  --bg3:       #2a2a32;
  --cream:     #f0ead8;
  --cream2:    #c8bfa8;
  --muted:     #7a7060;
  --gold:      #c9a84c;
  --gold2:     #a07828;
  --gold-dim:  rgba(201,168,76,.12);
  --red:       #8b1a1a;
  --border:    rgba(201,168,76,.18);
  --green:     #3a7a4a;
  --green-dim: rgba(58,122,74,.18);
  --r:         12px;
  --font:      'Open Sans', -apple-system, sans-serif;
  --font-b:    'Zen Old Mincho', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 3rem;
}

/* ── Header ── */
.page-header {
  text-align: center;
  padding: 1.4rem 1.2rem .9rem;
  border-bottom: 1px solid var(--border);
}
.logo-img { width: 38px; height: 38px; object-fit: contain; margin-bottom: .35rem }
.page-title {
  font-family: var(--font-b);
  font-size: .9rem;
  letter-spacing: .22em;
  color: var(--gold);
}

/* ── Phase Strip ── */
.phase-strip {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .9rem 1.3rem;
  border-bottom: 1px solid rgba(201,168,76,.1);
  max-width: 480px;
  margin: 0 auto;
}
.phase-icon {
  width: 44px; height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 1px solid rgba(201,168,76,.3);
  font-size: 1.3rem;
}
.phase-info { flex-shrink: 0 }
.phase-spirit-name {
  font-family: var(--font-b);
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--cream);
  letter-spacing: .04em;
  line-height: 1;
}
.phase-spirit-en {
  font-size: .6rem;
  color: var(--muted);
  letter-spacing: .15em;
  margin-top: .15rem;
}
.phase-progress { flex: 1; min-width: 0 }
.phase-progress-label {
  display: flex;
  justify-content: space-between;
  font-size: .68rem;
  color: var(--muted);
  margin-bottom: .28rem;
}
.pcount { color: var(--gold); font-weight: 600 }
.progress-bar-bg {
  height: 5px;
  background: var(--bg3);
  border-radius: 100px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold2), var(--gold));
  border-radius: 100px;
  transition: width .6s ease;
}

/* ── Phase banner ── */
.phase-banner {
  max-width: 480px;
  margin: .7rem auto 0;
  padding: 0 1.2rem;
}
.phase-badge {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: rgba(201,168,76,.08);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: 100px;
  padding: .25rem .75rem;
  font-size: .7rem;
  color: var(--gold);
  letter-spacing: .1em;
}

/* ── Section wrap ── */
.sw { padding: .75rem 1.2rem; max-width: 480px; margin: 0 auto }

/* ── Calendar Card ── */
.cal-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: .85rem .75rem .5rem;
}
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .55rem;
}
.cal-month-label {
  font-family: var(--font-b);
  font-size: .95rem;
  color: var(--cream);
  letter-spacing: .04em;
}
.cal-nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4rem;
  cursor: pointer;
  padding: .1rem .5rem;
  border-radius: 6px;
  line-height: 1;
  transition: color .15s, background .15s;
}
.cal-nav-btn:hover { color: var(--gold); background: var(--gold-dim) }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: .2rem;
}
.cal-wd {
  text-align: center;
  font-size: .6rem;
  color: var(--muted);
  padding: .12rem 0;
}
.cal-wd:first-child { color: #b06060 }
.cal-wd:last-child  { color: #6090b0 }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: .12rem;
}
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: .3rem;
  height: 44px;
  border-radius: 50%;
  cursor: default;
  position: relative;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.cal-cell.in-period { cursor: pointer }
.cal-cell.in-period:active { background: rgba(201,168,76,.12) }
.cal-cell.selected {
  box-shadow: 0 0 0 2px var(--gold);
  background: rgba(201,168,76,.07);
}
.cal-cell.today-unrecorded { background: rgba(201,168,76,.1) }
.cal-num {
  font-size: .8rem;
  line-height: 1;
  color: var(--cream2);
  display: block;
}
.cal-cell.out-period .cal-num { color: rgba(255,255,255,.08) }
.cal-cell.sun-col .cal-num   { color: #c08080 }
.cal-cell.sat-col .cal-num   { color: #7090b8 }
.cal-cell.completed .cal-num { color: var(--cream) }
.cal-cell.today-unrecorded .cal-num { color: var(--gold) }

.cal-icon { margin-top: 2px; display: flex; align-items: center; justify-content: center }
.cal-check {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: .56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
}
.cal-dot { width: 5px; height: 5px; border-radius: 50% }
.gold-dot { background: var(--gold) }
.gray-dot { background: var(--muted); opacity: .45 }
.cal-star  { font-size: .68rem; line-height: 1 }

.cal-legend {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .55rem .2rem .1rem;
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: .28rem;
  font-size: .62rem;
  color: var(--muted);
}

/* ── Streak bar ── */
.streak-bar {
  margin-top: .55rem;
  padding: .5rem .85rem;
  background: rgba(201,168,76,.05);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
}
.streak-inner { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap }
.streak-flames { font-size: .95rem; line-height: 1 }
.streak-text {
  font-family: var(--font-b);
  font-size: .88rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: .04em;
}
.streak-max { font-size: .65rem; color: var(--muted) }

/* ── Day detail ── */
.day-detail-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.15rem;
  position: relative;
  overflow: hidden;
}
.day-detail-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.day-detail-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .6rem;
}
.day-detail-date {
  font-family: var(--font-b);
  font-size: .92rem;
  color: var(--cream);
  letter-spacing: .03em;
}
.done-badge {
  font-size: .68rem;
  padding: .18rem .55rem;
  border-radius: 100px;
  background: var(--green-dim);
  color: #6dc46d;
  border: 1px solid rgba(58,122,74,.4);
}
.day-reflection-text {
  font-size: .84rem;
  color: var(--cream2);
  line-height: 1.75;
}

/* ── Reflection form ── */
.reflection-section { max-width: 480px; margin: 0 auto; padding: 0 1.2rem .8rem }
.reflection-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem;
  position: relative;
  overflow: hidden;
}
.reflection-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.reflection-day-label {
  font-size: .68rem;
  letter-spacing: .2em;
  color: var(--muted);
  margin-bottom: .28rem;
}
.reflection-title {
  font-family: var(--font-b);
  font-size: 1.05rem;
  color: var(--cream);
  font-weight: 700;
  margin-bottom: .85rem;
}
.reflection-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 8px;
  color: var(--cream);
  font-family: var(--font);
  font-size: .9rem;
  line-height: 1.7;
  padding: .72rem .9rem;
  resize: none;
  min-height: 88px;
  outline: none;
  transition: border-color .2s;
}
.reflection-textarea:focus { border-color: var(--gold) }
.reflection-textarea::placeholder { color: var(--muted) }
.btn-submit {
  display: block;
  width: 100%;
  margin-top: .82rem;
  padding: .78rem;
  background: linear-gradient(135deg, #8b1a1a, #a02020);
  border: none;
  border-radius: 8px;
  color: var(--cream);
  font-family: var(--font-b);
  font-size: .93rem;
  font-weight: 700;
  letter-spacing: .1em;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-submit:hover { opacity: .88 }
.btn-submit:disabled { opacity: .4; cursor: not-allowed }

/* ── Phase complete / Waiting screen ── */
.waiting-card {
  background: var(--bg2);
  border: 1px solid rgba(201,168,76,.3);
  border-radius: var(--r);
  padding: 1.4rem 1.2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.waiting-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.waiting-title {
  font-family: var(--font-b);
  font-size: 1.2rem;
  color: var(--gold);
  font-weight: 900;
  letter-spacing: .05em;
  margin-bottom: .45rem;
}
.waiting-desc {
  font-size: .84rem;
  color: var(--cream2);
  line-height: 1.8;
  margin-bottom: 1rem;
}
.cal-link {
  display: inline-block;
  font-size: .82rem;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid rgba(201,168,76,.4);
  padding: .5rem 1.3rem;
  border-radius: 100px;
  background: rgba(201,168,76,.08);
}

/* ── Loading / Error ── */
.loading-screen { text-align: center; padding: 4rem 1.5rem; color: var(--muted); font-size: .9rem }
.error-screen   { text-align: center; padding: 3rem 1.5rem; color: var(--muted) }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px) }
  to   { opacity: 1; transform: translateY(0) }
}
.fade-up { animation: fadeSlideUp .35s ease forwards }
</style>
</head>
<body>

<div class="page-header">
  <img src="logo.png" alt="SAMURAI in You" class="logo-img">
  <div class="page-title">道場の記録</div>
</div>

<div class="loading-screen" id="loading">読み込み中...</div>

<div id="main-content" style="display:none">

  <!-- Phase banner -->
  <div class="phase-banner sw" style="padding-top:.6rem;padding-bottom:0">
    <span class="phase-badge" id="phase-badge">Phase 1/4</span>
  </div>

  <!-- Phase strip -->
  <div class="phase-strip">
    <div class="phase-icon">⛩</div>
    <div class="phase-info">
      <div class="phase-spirit-name" id="spirit-name">—</div>
      <div class="phase-spirit-en"  id="spirit-en">—</div>
    </div>
    <div class="phase-progress">
      <div class="phase-progress-label">
        <span>稽古の進捗</span>
        <span class="pcount"><span id="stamped-count">0</span> / 21 日</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="sw">
    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <div class="cal-wd">日</div><div class="cal-wd">月</div>
        <div class="cal-wd">火</div><div class="cal-wd">水</div>
        <div class="cal-wd">木</div><div class="cal-wd">金</div>
        <div class="cal-wd">土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <div class="legend-item"><div class="cal-check" style="width:12px;height:12px;font-size:.5rem">✓</div><span>稽古完了</span></div>
        <div class="legend-item"><div class="cal-dot gold-dot"></div><span>今日の稽古</span></div>
        <div class="legend-item"><div class="cal-dot gray-dot"></div><span>未記録</span></div>
        <div class="legend-item"><span class="cal-star">⭐</span><span>節目</span></div>
      </div>
    </div>
    <div class="streak-bar" id="streak-bar" style="display:none"></div>
  </div>

  <!-- Past day detail -->
  <div class="sw" id="day-detail-wrap" style="display:none">
    <div id="day-detail-area"></div>
  </div>

  <!-- Today's reflection -->
  <div class="reflection-section" id="reflection-area"></div>

  <!-- Phase complete / Waiting screen -->
  <div class="sw" id="phase-complete-area" style="display:none"></div>

</div>

<div class="error-screen" id="error-screen" style="display:none">
  <div style="font-size:1.5rem;margin-bottom:.8rem">⚠️</div>
  <div id="error-msg" style="color:var(--cream2)">URLが正しくありません。<br>LINEのメッセージから開いてください。</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyC1qm7kUjSRk7QRwxK-W7bH1q-pqH3lklU",
  authDomain: "samurai-compass.firebaseapp.com",
  projectId: "samurai-compass",
  storageBucket: "samurai-compass.firebasestorage.app",
  messagingSenderId: "502771859953",
  appId: "1:502771859953:web:89e801832fdd42c6cb0450"
});
const db = firebase.firestore();

const SPIRIT_INFO = {
  hei:  { name: '平常心',     en: 'Heijoshin' },
  jiko: { name: '自己鍛錬',   en: 'Jiko Tanren' },
  flex: { name: '柔軟な適応力', en: 'Adaptability' },
  strat:{ name: '戦略的思考', en: 'Strategic Thinking' },
  sei:  { name: '誠実さ',     en: 'Seijitsu-sa' },
};

/* ── URL params ── */
const params   = new URLSearchParams(location.search);
const userId   = params.get('lid');
const todayDay = parseInt(params.get('day')) || null;

/* ── State ── */
let dojoData      = null;
let currentPhase  = 0;
let currentSpirit = null;
let spiritPlan    = [];
let phaseEntries  = [];
let stampedDays   = new Set();
let startDate     = null;
let dateEntryMap  = {};
let calYear, calMonth;
let selectedDateStr = null;

/* ── Utils ── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function localDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* ── Init ── */
async function init() {
  if (!userId) { showError('LINEのメッセージからアクセスしてください。'); return; }
  try {
    const doc = await db.collection('dojo_practices').doc(userId).get();
    if (!doc.exists) { showError('道場のデータが見つかりません。<br>管理者にお問い合わせください。'); return; }
    dojoData = doc.data();

    spiritPlan   = dojoData.spiritPlan || [];
    currentPhase = dojoData.currentPhase ?? 0;
    currentSpirit = spiritPlan[currentPhase] || null;

    const allEntries = dojoData.entries || [];
    phaseEntries = allEntries.filter(e => e.phase === currentPhase);
    phaseEntries.forEach(e => stampedDays.add(e.day));

    computeStartDate();
    buildDateEntryMap();
    render();
  } catch(e) {
    console.error(e);
    showError('データの読み込みに失敗しました。');
  }
}

function computeStartDate() {
  const d1 = phaseEntries.find(e => e.day === 1);
  if (d1?.timestamp) {
    const d = new Date(d1.timestamp);
    startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return;
  }
  if (dojoData.phaseStartedAt) {
    const d = dojoData.phaseStartedAt.toDate();
    startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return;
  }
  if (phaseEntries.length > 0) {
    const earliest = [...phaseEntries].sort((a,b) => a.day - b.day)[0];
    if (earliest.timestamp) {
      const d = new Date(earliest.timestamp);
      const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      base.setDate(base.getDate() - (earliest.day - 1));
      startDate = base;
      return;
    }
  }
  if (todayDay >= 1) {
    const t = new Date();
    const base = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    base.setDate(base.getDate() - (todayDay - 1));
    startDate = base;
    return;
  }
  startDate = new Date();
}

function buildDateEntryMap() {
  dateEntryMap = {};
  if (!startDate) return;
  phaseEntries.forEach(e => {
    if (!e.day) return;
    const d = addDays(startDate, e.day - 1);
    dateEntryMap[dateToStr(d)] = e;
  });
}

function calcStreak() {
  if (!stampedDays.size) return 0;
  const sorted = [...stampedDays].sort((a,b) => b - a);
  let streak = 1;
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === sorted[i-1] - 1) streak++;
    else break;
  }
  return streak;
}

function calcMaxStreak() {
  if (!stampedDays.size) return 0;
  const sorted = [...stampedDays].sort((a,b) => a - b);
  let max = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    cur = (sorted[i] === sorted[i-1] + 1) ? cur + 1 : 1;
    if (cur > max) max = cur;
  }
  return max;
}

/* ── Render ── */
function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  const info       = SPIRIT_INFO[currentSpirit] || { name: '—', en: '—' };
  const phaseNum   = currentPhase + 1;
  const totalPhase = spiritPlan.length || 4;
  const count      = stampedDays.size;
  const status     = dojoData.phaseStatus;

  document.getElementById('phase-badge').textContent  = `Phase ${phaseNum}/${totalPhase} — ${info.name}`;
  document.getElementById('spirit-name').textContent  = info.name;
  document.getElementById('spirit-en').textContent    = info.en;
  document.getElementById('stamped-count').textContent = count;
  document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();

  if (status === 'waiting_review' || status === 'completed') {
    showPhaseComplete(status, info.name);
    document.getElementById('reflection-area').innerHTML = '';
  } else if (todayDay >= 1 && todayDay <= 21) {
    renderReflection(todayDay);
  } else {
    document.getElementById('reflection-area').innerHTML = `
      <div style="text-align:center;padding:1rem 1.5rem">
        <div style="font-size:.8rem;color:var(--muted)">LINEのメッセージのリンクから<br>今日の稽古を記録してください。</div>
      </div>`;
  }
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth + 1}月`;

  const firstDay   = new Date(calYear, calMonth, 1);
  const lastDay    = new Date(calYear, calMonth + 1, 0);
  const startDow   = firstDay.getDay();
  const todayStr   = dateToStr(new Date());
  const periodStartStr = startDate ? dateToStr(startDate) : null;
  const periodEndStr   = startDate ? dateToStr(addDays(startDate, 20)) : null;
  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  let html = '';
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dow     = (startDow + d - 1) % 7;
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const inPeriod     = periodStartStr && dateStr >= periodStartStr && dateStr <= periodEndStr;
    const entry        = dateEntryMap[dateStr];
    const isCompleted  = !!entry;
    const isTodayPractice = dateStr === todayPracticeStr;
    const isSelected   = dateStr === selectedDateStr;
    const isPast       = dateStr < todayStr;

    let dayNum = null;
    if (inPeriod && startDate) {
      dayNum = Math.round((localDate(dateStr) - startDate) / 86400000) + 1;
    }

    let icon = '';
    if (isCompleted && dayNum && (dayNum === 7 || dayNum === 14 || dayNum === 21)) {
      icon = `<div class="cal-icon"><span class="cal-star">⭐</span></div>`;
    } else if (isCompleted) {
      icon = `<div class="cal-icon"><div class="cal-check">✓</div></div>`;
    } else if (isTodayPractice) {
      icon = `<div class="cal-icon"><div class="cal-dot gold-dot"></div></div>`;
    } else if (inPeriod && isPast) {
      icon = `<div class="cal-icon"><div class="cal-dot gray-dot"></div></div>`;
    }

    let cls = 'cal-cell';
    if (!inPeriod) cls += ' out-period';
    else {
      cls += ' in-period';
      if (isCompleted)                       cls += ' completed';
      if (isTodayPractice && !isCompleted)   cls += ' today-unrecorded';
      if (isSelected)                        cls += ' selected';
    }
    if (dow === 0) cls += ' sun-col';
    if (dow === 6) cls += ' sat-col';

    const click = inPeriod ? `onclick="selectCalDate('${dateStr}',${dayNum})"` : '';
    html += `<div class="${cls}" ${click}>
      <span class="cal-num">${d}</span>${icon}
    </div>`;
  }

  const totalCells = startDow + lastDay.getDate();
  const rem = totalCells % 7;
  if (rem) for (let i = 0; i < 7 - rem; i++) html += `<div class="cal-cell"></div>`;

  document.getElementById('cal-grid').innerHTML = html;

  const streak    = calcStreak();
  const maxStreak = calcMaxStreak();
  const bar = document.getElementById('streak-bar');
  if (streak >= 2) {
    const flames = '🔥'.repeat(Math.min(streak, 5));
    bar.innerHTML = `<div class="streak-inner">
      <span class="streak-flames">${flames}</span>
      <span class="streak-text">${streak}日連続！</span>
      ${maxStreak > streak ? `<span class="streak-max">最高記録: ${maxStreak}日</span>` : ''}
    </div>`;
    bar.style.display = 'flex';
  } else {
    bar.style.display = 'none';
  }
}

function selectCalDate(dateStr, dayNum) {
  selectedDateStr = dateStr;
  renderCalendar();

  const entry = dateEntryMap[dateStr];
  const d = localDate(dateStr);
  const DOW = ['日','月','火','水','木','金','土'];
  const label = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;

  const wrap = document.getElementById('day-detail-wrap');
  const area = document.getElementById('day-detail-area');

  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  if (dateStr === todayPracticeStr && !entry) {
    wrap.style.display = 'none';
    document.getElementById('reflection-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }

  wrap.style.display = '';

  if (entry) {
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span class="done-badge">✓ Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text">
          ${entry.text ? escHtml(entry.text).replace(/\n/g,'<br>') : '<span style="color:var(--muted)">（振り返りの記録なし）</span>'}
        </div>
      </div>`;
  } else {
    const isPast = dateStr < dateToStr(new Date());
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span style="font-size:.68rem;color:var(--muted)">Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text" style="color:var(--muted)">
          ${isPast ? 'この日の記録はありません。' : '稽古の日を楽しみに。'}
        </div>
      </div>`;
  }

  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

/* ── Reflection form ── */
function renderReflection(day) {
  const area = document.getElementById('reflection-area');

  if (stampedDays.has(day)) {
    const entry = phaseEntries.find(e => e.day === day);
    area.innerHTML = `
      <div class="reflection-card fade-up">
        <div class="reflection-day-label">DAY ${day} · 記録済み</div>
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem">
          <svg width="28" height="28" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="22" stroke="#3a7a4a" stroke-width="2.5"/><polyline points="15,26 22,34 37,17" stroke="#3a7a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size:.88rem;color:var(--cream2)">Day ${day} の稽古を記録しました</span>
        </div>
        ${entry?.text ? `<div style="font-size:.82rem;color:var(--muted);line-height:1.7;padding:.55rem .75rem;background:var(--bg3);border-radius:6px">${escHtml(entry.text).replace(/\n/g,'<br>')}</div>` : ''}
      </div>`;
    return;
  }

  area.innerHTML = `
    <div class="reflection-card fade-up">
      <div class="reflection-day-label">DAY ${day} · 今日の気づき</div>
      <div class="reflection-title">稽古の振り返り</div>
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:.5rem">ファシリテーターに届きます</div>
      <textarea class="reflection-textarea" id="reflection-text"
        placeholder="今日の稽古から何を感じましたか？どんな小さな気づきでも構いません。" rows="4"></textarea>
      <button class="btn-submit" id="submit-btn" onclick="submitPractice(${day})">
        ⚔️ 稽古を記録する
      </button>
    </div>`;
}

/* ── Submit practice ── */
async function submitPractice(day) {
  const textEl = document.getElementById('reflection-text');
  const text   = textEl?.value?.trim() || '';
  const btn    = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '記録中...' }

  const entry = {
    day,
    phase: currentPhase,
    spirit: currentSpirit,
    text,
    timestamp: new Date().toISOString()
  };

  try {
    await db.collection('dojo_practices').doc(userId).set({
      entries: firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    stampedDays.add(day);
    phaseEntries.push({ ...entry, timestamp: new Date() });
    buildDateEntryMap();

    const count = stampedDays.size;
    document.getElementById('stamped-count').textContent = count;
    document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

    renderCalendar();
    renderReflection(day);
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '⚔️ 稽古を記録する' }
    alert('記録に失敗しました。もう一度お試しください。');
  }
}

/* ── Phase complete screen ── */
function showPhaseComplete(status, spiritName) {
  const area = document.getElementById('phase-complete-area');

  if (status === 'completed') {
    area.innerHTML = `
      <div class="waiting-card fade-up">
        <div style="font-size:2rem;margin-bottom:.7rem">⚔️</div>
        <div class="waiting-title">すべての稽古、完了。</div>
        <div class="waiting-desc">
          4つのSpiritの鍛錬を修めた。<br>
          これからは、あなた自身が道を切り拓いていく。<br><br>
          <em>千日の稽古を鍛とし、万日の稽古を錬とす。</em><br>
          <span style="font-size:.75rem;color:var(--muted)">— 宮本武蔵</span>
        </div>
      </div>`;
  } else {
    const calUrl = 'https://cal.com/samurai-in-you/21dayafterfeedback';
    area.innerHTML = `
      <div class="waiting-card fade-up">
        <div style="font-size:1.5rem;margin-bottom:.6rem">⚔️</div>
        <div class="waiting-title">「${spiritName}」の稽古、完了。</div>
        <div class="waiting-desc">
          21日間、続けた。<br>それだけで、すでに侍だ。<br><br>
          振り返りミーティングの予約をしてください。<br>
          道場長と共に、次のSpiritへと進みます。
        </div>
        <a href="${calUrl}" class="cal-link" target="_blank">
          📅 ミーティングを予約する
        </a>
      </div>`;
  }

  area.style.display = '';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-msg').innerHTML = msg;
}

init();
</script>
