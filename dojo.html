<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道場の記録 — SAMURAI in You</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Zen+Old+Mincho:wght@400;700;900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #1a1a1f;
  --bg2:       #222228;
  --bg3:       #2a2a32;
  --cream:     #f0ead8;
  --cream2:    #d8d0bc;
  --muted:     #a09480;
  --gold:      #c9a84c;
  --gold2:     #a07828;
  --gold-dim:  rgba(201,168,76,.12);
  --red:       #8b1a1a;
  --border:    rgba(201,168,76,.18);
  --green:     #3a7a4a;
  --green-dim: rgba(58,122,74,.18);
  --r:         12px;
  --font:      'Inter', 'Open Sans', -apple-system, sans-serif;
  --font-b:    'Zen Old Mincho', serif;
  --font-brush: 'Cormorant Garamond', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font);
  font-size: 16px;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 3rem;
}

/* ── Header ── */
.page-header {
  text-align: center;
  padding: 1.4rem 1.2rem .9rem;
  border-bottom: 1px solid var(--border);
}
.logo-img { width: 38px; height: 38px; object-fit: contain; margin-bottom: .35rem }
.page-title {
  font-family: 'Yuji Syuku', serif;
  font-size: 1.75rem;
  letter-spacing: .18em;
  color: var(--gold);
}

/* ── Phase Strip ── */
.phase-strip {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .9rem 1.3rem;
  border-bottom: 1px solid rgba(201,168,76,.1);
  max-width: 480px;
  margin: 0 auto;
}
.phase-icon {
  width: 44px; height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 1px solid rgba(201,168,76,.3);
  font-size: 1.3rem;
}
.phase-info { flex-shrink: 0 }
.phase-spirit-name {
  font-family: var(--font-b);
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--cream);
  letter-spacing: .04em;
  line-height: 1;
}
.phase-spirit-en {
  font-size: .72rem;
  color: var(--muted);
  letter-spacing: .15em;
  margin-top: .15rem;
}
.phase-progress { flex: 1; min-width: 0 }
.phase-progress-label {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: .28rem;
}
.pcount { color: var(--gold); font-weight: 600 }
.progress-bar-bg {
  height: 5px;
  background: var(--bg3);
  border-radius: 100px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold2), var(--gold));
  border-radius: 100px;
  transition: width .6s ease;
}

/* ── Rank Badge ── */
.rank-badge {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .28rem .65rem;
  border-radius: 100px;
  border: 1px solid rgba(201,168,76,.35);
  background: rgba(201,168,76,.07);
  font-family: var(--font-b);
  font-size: .78rem;
  color: var(--gold);
  letter-spacing: .08em;
  margin-top: .4rem;
  transition: all .4s ease;
}
.rank-badge.rank-2 {
  border-color: rgba(201,168,76,.5);
  background: rgba(201,168,76,.1);
}
.rank-badge.rank-5 {
  border-color: rgba(201,168,76,.8);
  background: #0d0d0d;
  color: var(--gold);
  box-shadow: 0 0 14px rgba(201,168,76,.2), inset 0 0 0 1px rgba(201,168,76,.15);
  font-weight: 700;
}
.rank-sub {
  font-family: var(--font);
  font-size: .62rem;
  color: var(--muted);
  letter-spacing: .12em;
  display: block;
  margin-top: .05rem;
}

/* ── Phase banner ── */
.phase-banner {
  max-width: 480px;
  margin: .7rem auto 0;
  padding: 0 1.2rem;
}
.phase-badge {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  background: rgba(201,168,76,.08);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: 100px;
  padding: .28rem .85rem;
  font-size: .85rem;
  color: var(--gold);
  letter-spacing: .1em;
}

/* ── Section wrap ── */
.sw { padding: .75rem 1.2rem; max-width: 480px; margin: 0 auto }

/* ── Calendar Card ── */
.cal-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: .85rem .75rem .5rem;
}
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .55rem;
}
.cal-month-label {
  font-family: var(--font);
  font-size: .95rem;
  font-weight: 600;
  color: var(--cream);
  letter-spacing: .02em;
}
.cal-nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4rem;
  cursor: pointer;
  padding: .1rem .5rem;
  border-radius: 6px;
  line-height: 1;
  transition: color .15s, background .15s;
}
.cal-nav-btn:hover { color: var(--gold); background: var(--gold-dim) }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: .2rem;
}
.cal-wd {
  text-align: center;
  font-size: .72rem;
  color: var(--muted);
  padding: .12rem 0;
}
.cal-wd:first-child { color: #b06060 }
.cal-wd:last-child  { color: #6090b0 }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: .12rem;
}
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: .3rem;
  height: 44px;
  border-radius: 50%;
  cursor: default;
  position: relative;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.cal-cell.in-period { cursor: pointer }
.cal-cell.in-period:active { background: rgba(201,168,76,.12) }
.cal-cell.selected {
  box-shadow: 0 0 0 2px var(--gold);
  background: rgba(201,168,76,.07);
}
.cal-cell.today-unrecorded { background: rgba(201,168,76,.1) }
.cal-cell.grace-day .cal-num { color: rgba(201,168,76,.45) }
.cal-cell.grace-day .cal-dot.grace-dot { background: rgba(201,168,76,.3); width: 6px; height: 6px }
.cal-num {
  font-size: .88rem;
  line-height: 1;
  color: var(--cream2);
  display: block;
}
.cal-cell.out-period .cal-num { color: rgba(255,255,255,.08) }
.cal-cell.sun-col .cal-num   { color: #c08080 }
.cal-cell.sat-col .cal-num   { color: #7090b8 }
.cal-cell.completed .cal-num { color: var(--cream) }
.cal-cell.today-unrecorded .cal-num { color: var(--gold) }

.cal-icon { margin-top: 2px; display: flex; align-items: center; justify-content: center }
.cal-check {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: .65rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
}
.cal-dot { width: 6px; height: 6px; border-radius: 50% }
.gold-dot { background: var(--gold) }
.gray-dot { background: var(--muted); opacity: .45 }
.cal-star  { font-size: .78rem; line-height: 1 }

.cal-legend {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .55rem .2rem .1rem;
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: .28rem;
  font-size: .75rem;
  color: var(--muted);
}

/* ── Streak bar ── */
.streak-bar {
  margin-top: .55rem;
  padding: .75rem 1rem;
  background: rgba(201,168,76,.05);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 10px;
}
.streak-main { display: flex; align-items: center; gap: .6rem; margin-bottom: .45rem }
.streak-flames { font-size: 1.5rem; line-height: 1; flex-shrink: 0 }
.streak-num {
  font-family: var(--font-brush);
  font-size: 2rem; font-weight: 700;
  color: var(--gold); line-height: 1;
}
.streak-unit { font-size: .88rem; color: var(--cream2); line-height: 1.3; padding-top: .2rem }
.streak-badge {
  margin-left: auto;
  font-size: .75rem; font-weight: 600;
  padding: .2rem .55rem; border-radius: 100px;
  background: rgba(201,168,76,.15);
  color: var(--gold); letter-spacing: .05em;
}
.streak-next {
  font-size: .85rem; color: var(--cream2); margin-bottom: .35rem;
}
.streak-progress-track {
  height: 4px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden;
}
.streak-progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, rgba(201,168,76,.6), var(--gold));
  transition: width .6s ease;
}
.streak-preview {
  font-size: .85rem; color: rgba(201,168,76,.6);
  margin-top: .4rem; font-style: italic;
}

/* ── Day detail ── */
.day-detail-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.15rem;
  position: relative;
  overflow: hidden;
}
.day-detail-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.day-detail-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .6rem;
}
.day-detail-date {
  font-family: var(--font);
  font-size: .92rem;
  font-weight: 600;
  color: var(--cream);
}
.done-badge {
  font-size: .75rem;
  padding: .18rem .6rem;
  border-radius: 100px;
  background: var(--green-dim);
  color: #6dc46d;
  border: 1px solid rgba(58,122,74,.4);
}
.day-reflection-text {
  font-size: .9rem;
  color: var(--cream2);
  line-height: 1.8;
}

/* ── Reflection form ── */
.reflection-section { max-width: 480px; margin: 0 auto; padding: 0 1.2rem .8rem }
.reflection-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem;
  position: relative;
  overflow: hidden;
}
.reflection-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.reflection-day-label {
  font-size: .78rem;
  letter-spacing: .2em;
  color: var(--muted);
  margin-bottom: .28rem;
}
.reflection-title {
  font-family: var(--font-b);
  font-size: 1.15rem;
  color: var(--cream);
  font-weight: 700;
  margin-bottom: .85rem;
}
.reflection-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid rgba(201,168,76,.2);
  border-radius: 8px;
  color: var(--cream);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.75;
  padding: .78rem .9rem;
  resize: none;
  min-height: 96px;
  outline: none;
  transition: border-color .2s;
}
.reflection-textarea:focus { border-color: var(--gold) }
.reflection-textarea::placeholder { color: var(--muted) }

/* ── Quick check-in ── */
.quick-checkin {
  display: flex;
  gap: .55rem;
  margin-bottom: .75rem;
}
.qci-btn {
  flex: 1;
  background: var(--bg3);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: .6rem .3rem;
  cursor: pointer;
  text-align: center;
  transition: background .15s, border-color .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.qci-btn:active { transform: scale(.95) }
.qci-btn.selected {
  background: rgba(201,168,76,.12);
  border-color: var(--gold);
}
.qci-icon { font-size: 1.5rem; line-height: 1; margin-bottom: .3rem }
.qci-label {
  font-size: .72rem;
  color: var(--cream2);
  line-height: 1.3;
}
.qci-btn.selected .qci-label { color: var(--gold) }
.qci-or {
  text-align: center;
  font-size: .75rem;
  color: var(--muted);
  margin: .5rem 0 .4rem;
  letter-spacing: .1em;
}

.facilitator-comment {
  margin-top: .8rem;
  padding: .7rem .85rem;
  background: rgba(201,168,76,.06);
  border-left: 2px solid rgba(201,168,76,.5);
  border-radius: 0 6px 6px 0;
  animation: fadeUp .4s ease both;
}
.facilitator-comment-label {
  font-size: .72rem;
  letter-spacing: .08em;
  color: rgba(201,168,76,.65);
  margin-bottom: .3rem;
  text-transform: uppercase;
}
.facilitator-comment-text {
  font-size: .9rem;
  color: var(--cream2);
  line-height: 1.8;
  font-style: italic;
}
.fellow-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  margin-top: .7rem;
  padding: .5rem .8rem;
  background: rgba(201,168,76,.06);
  border: 1px solid rgba(201,168,76,.15);
  border-radius: 8px;
  font-size: .8rem;
  color: var(--muted);
  letter-spacing: .04em;
}
.fellow-num {
  color: var(--gold);
  font-weight: 600;
  font-size: .88rem;
}
.past-self {
  margin-bottom: 1rem;
  padding: .85rem;
  background: rgba(126,168,212,.05);
  border: 1px solid rgba(126,168,212,.18);
  border-radius: 8px;
}
.past-self-header {
  display: flex;
  align-items: center;
  gap: .45rem;
  margin-bottom: .55rem;
}
.past-self-icon { font-size: 1rem; flex-shrink: 0 }
.past-self-title {
  font-size: .78rem;
  color: rgba(126,184,212,.75);
  letter-spacing: .07em;
}
.past-self-day {
  font-size: .68rem;
  color: var(--muted);
  margin-left: auto;
}
.past-self-text {
  font-size: .9rem;
  color: var(--cream2);
  line-height: 1.8;
  font-style: italic;
  padding-left: .3rem;
  border-left: 1.5px solid rgba(126,184,212,.25);
  padding-left: .6rem;
}
.past-self-divider {
  text-align: center;
  font-size: .72rem;
  color: var(--muted);
  letter-spacing: .12em;
  margin: .6rem 0 .9rem;
}
.today-intent {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  margin-bottom: .9rem;
  padding: .7rem .85rem;
  background: rgba(58,122,74,.08);
  border-left: 2px solid rgba(58,122,74,.5);
  border-radius: 0 6px 6px 0;
}
.today-intent-icon { font-size: 1rem; flex-shrink: 0; margin-top: .1rem }
.today-intent-body {}
.today-intent-label {
  font-size: .74rem;
  letter-spacing: .08em;
  color: rgba(100,180,120,.7);
  margin-bottom: .25rem;
  text-transform: uppercase;
}
.today-intent-text {
  font-size: .92rem;
  color: var(--cream2);
  line-height: 1.7;
}
.past-quote {
  margin-bottom: .9rem;
  padding: .7rem .85rem;
  background: rgba(201,168,76,.05);
  border-left: 2px solid rgba(201,168,76,.35);
  border-radius: 0 6px 6px 0;
}
.past-quote-label {
  font-size: .78rem;
  letter-spacing: .06em;
  color: rgba(201,168,76,.55);
  margin-bottom: .35rem;
  text-transform: uppercase;
}
.past-quote-text {
  font-size: .9rem;
  color: var(--muted);
  line-height: 1.8;
  font-style: italic;
}
.btn-submit {
  display: block;
  width: 100%;
  margin-top: .85rem;
  padding: .88rem;
  background: linear-gradient(135deg, #8b1a1a, #a02020);
  border: none;
  border-radius: 8px;
  color: var(--cream);
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .06em;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-submit:hover { opacity: .88 }
.btn-submit:disabled { opacity: .4; cursor: not-allowed }

/* ── Phase complete / Waiting screen ── */
.waiting-card {
  background: var(--bg2);
  border: 1px solid rgba(201,168,76,.3);
  border-radius: var(--r);
  padding: 1.4rem 1.2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.waiting-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.waiting-title {
  font-family: var(--font-b);
  font-size: 1.3rem;
  color: var(--gold);
  font-weight: 900;
  letter-spacing: .05em;
  margin-bottom: .5rem;
}
.waiting-desc {
  font-size: .92rem;
  color: var(--cream2);
  line-height: 1.85;
  margin-bottom: 1rem;
}
.waiting-interim-prompt {
  margin: 1rem 0;
  padding: .8rem 1rem;
  background: rgba(201,168,76,.06);
  border-left: 2px solid rgba(201,168,76,.4);
  border-radius: 0 6px 6px 0;
  text-align: left;
}
.waiting-interim-label {
  font-size: .78rem;
  letter-spacing: .08em;
  color: rgba(201,168,76,.55);
  margin-bottom: .4rem;
}
.waiting-interim-q {
  font-size: .95rem;
  color: var(--cream);
  line-height: 1.8;
}
.waiting-next-spirit {
  margin-top: 1.1rem;
  font-size: .85rem;
  color: var(--muted);
  letter-spacing: .04em;
}
.cal-link {
  display: inline-block;
  font-size: .9rem;
  color: var(--gold);
  text-decoration: none;
  border: 1px solid rgba(201,168,76,.4);
  padding: .5rem 1.3rem;
  border-radius: 100px;
  background: rgba(201,168,76,.08);
}

/* ── Loading / Error ── */
.loading-screen { text-align: center; padding: 4rem 1.5rem; color: var(--muted); font-size: .9rem }
.error-screen   { text-align: center; padding: 3rem 1.5rem; color: var(--muted) }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px) }
  to   { opacity: 1; transform: translateY(0) }
}
.fade-up { animation: fadeSlideUp .35s ease forwards }

/* ── Pentagon Compass ── */
.pentagon-section { max-width: 480px; margin: 0 auto; padding: .55rem 1.2rem }
.pentagon-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: .9rem .5rem .7rem;
}
.pentagon-title {
  text-align: center;
  font-family: var(--font);
  font-size: .8rem;
  font-weight: 500;
  letter-spacing: .18em;
  color: var(--muted);
  margin-bottom: .2rem;
}
.pentagon-status {
  text-align: center;
  font-size: .85rem;
  letter-spacing: .06em;
  margin-top: .35rem;
  min-height: 1rem;
}
@keyframes spiritRingPulse {
  0%   { transform: scale(1);    opacity: .65 }
  100% { transform: scale(1.65); opacity: 0   }
}
.spirit-outer-ring {
  transform-box: fill-box;
  transform-origin: center;
  animation: spiritRingPulse 2s ease-out infinite;
}

/* ── 稽古完了オーバーレイ ── */
#complete-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(6,4,2,.92);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .35s ease;
}
#complete-overlay.show { opacity: 1; pointer-events: auto; }
#complete-overlay.hide { opacity: 0; pointer-events: none; transition: opacity .5s ease; }

#complete-card {
  text-align: center; padding: 2.5rem 2rem;
  max-width: 320px; width: 90%;
  transform: translateY(24px);
  transition: transform .4s cubic-bezier(.22,1,.36,1);
  position: relative;
}
#complete-overlay.show #complete-card { transform: translateY(0); }

/* 筆線アニメーション */
#complete-brush {
  width: 180px; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 1.4rem;
  transform: scaleX(0); transform-origin: left;
  transition: transform .55s cubic-bezier(.22,1,.36,1) .15s;
}
#complete-overlay.show #complete-brush { transform: scaleX(1); }

#complete-kanji {

#complete-label {

}

#complete-streak {

@keyframes milestoneGlow {
  0%,100% { box-shadow: 0 0 40px rgba(201,168,76,.12), inset 0 0 30px rgba(201,168,76,.04); }
  50%      { box-shadow: 0 0 60px rgba(201,168,76,.22), inset 0 0 40px rgba(201,168,76,.08); }
}

}

@keyframes starFloat {

  30%  { opacity:1; }
  100% { opacity:0; transform: translateY(-40px) scale(1); }
}

  position: absolute; font-size: .9rem;
  animation: starFloat 2s ease-out forwards;
  pointer-events: none;
}

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC1qm7kUjSRk7QRwxK-W7bH1q-pqH3lklU",
  authDomain: "samurai-compass.firebaseapp.com",
  projectId: "samurai-compass",
  storageBucket: "samurai-compass.firebasestorage.app",
  messagingSenderId: "502771859953",
  appId: "1:502771859953:web:89e801832fdd42c6cb0450"
});
const db = firebase.firestore();

const SPIRIT_INFO = {
  hei:  { name: '平常心',     en: 'Heijoshin' },
  jiko: { name: '自己鍛錬',   en: 'Jiko Tanren' },
  flex: { name: '柔軟な適応力', en: 'Adaptability' },
  strat:{ name: '戦略的思考', en: 'Strategic Thinking' },
  sei:  { name: '誠実さ',     en: 'Seijitsu-sa' },
};

/* ── URL params ── */
const params   = new URLSearchParams(location.search);
const userId   = params.get('lid');
const todayDay = parseInt(params.get('day')) || null;

/* ── State ── */
let dojoData      = null;
let currentPhase  = 0;
let currentSpirit = null;
let spiritPlan    = [];
let phaseEntries  = [];
let stampedDays   = new Set();
let startDate     = null;
let dateEntryMap  = {};
let calYear, calMonth;
let selectedDateStr = null;
let fellowCount   = 0;      // 今日稽古した仲間の人数（自分含む）

function todayJstKey() {
  const jst = new Date(Date.now() + 9 * 60 * 60 * 1000);
  return `${jst.getUTCFullYear()}${String(jst.getUTCMonth()+1).padStart(2,'0')}${String(jst.getUTCDate()).padStart(2,'0')}`;
}

/* ── Utils ── */
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function calcRank() {
  const status = dojoData?.phaseStatus;
  const totalCompleted = currentPhase + (status === 'completed' ? 1 : 0);
  if (totalCompleted === 0) return { title: '入門中', sub: 'In Training', level: 0 };
  // 十級(1完了)〜一級(10完了) → 段位へ
  const KYU = ['十級','九級','八級','七級','六級','五級','四級','三級','二級','一級'];
  if (totalCompleted <= 10) {
    const kyu = KYU[totalCompleted - 1];
    const level = totalCompleted >= 6 ? 2 : 1;
    return { title: kyu, sub: `${totalCompleted}st Spirit`, level };
  }
  // 初段以上
  const DAN = ['初段','二段','三段','四段','五段'];
  const danIdx = Math.min(totalCompleted - 11, DAN.length - 1);
  return { title: DAN[danIdx], sub: 'SAMURAI', level: 5 };
}

function renderRankBadge() {
  const wrap = document.getElementById('rank-badge-wrap');
  if (!wrap) return;
  const r = calcRank();
  wrap.innerHTML = `
    <div class="rank-badge rank-${r.level}">
      ⚔ ${r.title}
    </div>
    <span class="rank-sub">${r.sub}</span>`;
}

function updateFellowBanner() {
  const wrap   = document.getElementById('fellow-wrap');
  const banner = document.getElementById('fellow-banner');
  if (!wrap || !banner || fellowCount < 2) { if (wrap) wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const PHRASES = ['が今日も稽古しました', 'が今日の道場に立ちました', 'が同じ道を歩んでいます'];
  const phrase  = PHRASES[fellowCount % PHRASES.length];
  banner.innerHTML = `<span class="fellow-num">${fellowCount}人</span><span>${phrase}</span>`;
}
function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function localDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* ── Init ── */
async function init() {
  if (!userId) { showError('LINEのメッセージからアクセスしてください。'); return; }
  try {
    const doc = await db.collection('dojo_practices').doc(userId).get();
    if (!doc.exists) { showError('道場のデータが見つかりません。<br>管理者にお問い合わせください。'); return; }
    dojoData = doc.data();

    spiritPlan   = dojoData.spiritPlan || [];
    currentPhase = dojoData.currentPhase ?? 0;
    currentSpirit = spiritPlan[currentPhase] || null;

    const allEntries = dojoData.entries || [];
    phaseEntries = allEntries.filter(e => e.phase === currentPhase);
    phaseEntries.forEach(e => stampedDays.add(e.day));

    computeStartDate();
    buildDateEntryMap();
    render();

    // 仲間カウントを非同期で読み込み（表示に遅れがあっても可）
    db.collection('dojo_stats').doc(todayJstKey()).get().then(snap => {
      if (snap.exists) {
        fellowCount = snap.data().count || 0;
        updateFellowBanner();
      }
    }).catch(() => {});
  } catch(e) {
    console.error(e);
    showError('データの読み込みに失敗しました。');
  }
}

function computeStartDate() {
  const d1 = phaseEntries.find(e => e.day === 1);
  if (d1?.timestamp) {
    const d = new Date(d1.timestamp);
    startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return;
  }
  if (dojoData.phaseStartedAt) {
    const d = dojoData.phaseStartedAt.toDate();
    startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return;
  }
  if (phaseEntries.length > 0) {
    const earliest = [...phaseEntries].sort((a,b) => a.day - b.day)[0];
    if (earliest.timestamp) {
      const d = new Date(earliest.timestamp);
      const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      base.setDate(base.getDate() - (earliest.day - 1));
      startDate = base;
      return;
    }
  }
  if (todayDay >= 1) {
    const t = new Date();
    const base = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    base.setDate(base.getDate() - (todayDay - 1));
    startDate = base;
    return;
  }
  startDate = new Date();
}

function buildDateEntryMap() {
  dateEntryMap = {};
  if (!startDate) return;
  phaseEntries.forEach(e => {
    if (!e.day) return;
    const d = addDays(startDate, e.day - 1);
    dateEntryMap[dateToStr(d)] = e;
  });
}

// 1日穴埋め猶予付き連続計算
// 記録した日数だけカウント、1日の空白は連続を切らない
function calcStreakFrom(days, fromDay) {
  let streak = 0;
  let gapUsed = false;
  for (let d = fromDay; d >= 1; d--) {
    if (days.has(d)) {
      streak++;
      gapUsed = false;
    } else {
      if (!gapUsed) {
        gapUsed = true; // 1日だけ猶予
      } else {
        break; // 2日連続で空白 → 終了
      }
    }
  }
  return streak;
}

function calcStreak() {
  if (!stampedDays.size) return 0;
  const latest = Math.max(...stampedDays);
  return calcStreakFrom(stampedDays, latest);
}

function calcMaxStreak() {
  if (!stampedDays.size) return 0;
  // 各「run」の末尾（次の日が2日以上空く日）でのみ calcStreakFrom を呼ぶ
  const sorted = [...stampedDays].sort((a,b) => a - b);
  let max = 0;
  for (let i = 0; i < sorted.length; i++) {
    const next = sorted[i + 1];
    // 次の記録日が2日以上先か、または最後の要素なら run の末尾
    if (!next || next - sorted[i] >= 2) {
      const s = calcStreakFrom(stampedDays, sorted[i]);
      if (s > max) max = s;
    }
  }
  return max;
}

// 今日記録した場合の仮ストリーク（プレビュー用）
function calcStreakIfToday(todayDayNum) {
  const hypothetical = new Set([...stampedDays, todayDayNum]);
  return calcStreakFrom(hypothetical, todayDayNum);
}

/* ── Pentagon Compass ── */
function renderPentagonCompass() {
  const el = document.getElementById('pentagon-compass');
  if (!el) return;

  // c1=bright highlight, c2=dark gradient end, cs=3D shadow color
  const SP = [
    { id:'hei',   name:'平常心',     kanji:'平', c1:'#ffe060', c2:'#a07820', cs:'#705010', cx:120, cy: 47, lx:120, ly: 17, ta:'middle' },
    { id:'jiko',  name:'自己鍛錬',   kanji:'鍛', c1:'#ff8060', c2:'#b03020', cs:'#7a1a08', cx:194, cy:101, lx:228, ly:104, ta:'start'  },
    { id:'strat', name:'戦略的思考', kanji:'謀', c1:'#b070ff', c2:'#6030a0', cs:'#3a1878', cx:166, cy:188, lx:180, ly:221, ta:'start'  },
    { id:'sei',   name:'誠実さ',     kanji:'誠', c1:'#60a0ff', c2:'#2050b0', cs:'#0e2878', cx: 74, cy:188, lx: 60, ly:221, ta:'end'    },
    { id:'flex',  name:'柔軟な適応', kanji:'適', c1:'#50d090', c2:'#1a7050', cs:'#0a3820', cx: 46, cy:101, lx: 18, ly:104, ta:'end'    },
  ];

  const excluded  = dojoData.excludedSpirit;
  const isWaiting = dojoData.phaseStatus === 'waiting_review';
  const isAllDone = dojoData.phaseStatus === 'completed';
  const count     = stampedDays.size;
  const pts       = SP.map(s => `${s.cx},${s.cy}`).join(' ');
  const CIRC      = (2 * Math.PI * 28).toFixed(1); // progress ring circumference (r=28)

  const defs = SP.map(s => `
    <radialGradient id="pg-${s.id}" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="${s.c1}"/>
      <stop offset="100%" stop-color="${s.c2}"/>
    </radialGradient>`).join('');

  let nodes = '';
  SP.forEach(s => {
    const planIdx    = spiritPlan.indexOf(s.id);
    const isLite     = s.id === excluded;
    const isDojoDone = planIdx >= 0 && (planIdx < currentPhase || isAllDone);
    const isComplete = isLite || isDojoDone;
    const isActive   = planIdx === currentPhase && !isAllDone;
    const arc        = (Math.min(count / 21, 1) * parseFloat(CIRC)).toFixed(1);

    if (isComplete) {
      nodes += `
        <circle cx="${s.cx}" cy="${s.cy+4}" r="24" fill="${s.cs}" opacity=".9"/>
        <circle cx="${s.cx}" cy="${s.cy}" r="24" fill="url(#pg-${s.id})" stroke="${s.c1}" stroke-width="2"/>`;
      if (isLite) {
        nodes += `
          <circle cx="${s.cx+17}" cy="${s.cy-17}" r="8.5" fill="#1a1a1f" stroke="${s.c1}" stroke-width="1.5"/>
          <text x="${s.cx+17}" y="${s.cy-13}" text-anchor="middle" font-size="8.5" fill="${s.c1}" font-weight="bold">入</text>`;
      } else {
        nodes += `
          <circle cx="${s.cx+17}" cy="${s.cy-17}" r="8.5" fill="#3a8a4a" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <text x="${s.cx+17}" y="${s.cy-13}" text-anchor="middle" font-size="10" fill="white" font-weight="bold">✓</text>`;
      }
    } else if (isActive) {
      const fill = isWaiting ? `${s.c1}35` : `${s.c1}18`;
      const ringClass = isWaiting ? '' : ' class="spirit-outer-ring"';
      nodes += `
        <circle cx="${s.cx}" cy="${s.cy}" r="31" fill="none" stroke="${s.c1}" stroke-width="1.5"${ringClass}/>
        <circle cx="${s.cx}" cy="${s.cy+4}" r="24" fill="${s.cs}" opacity=".9"/>
        <circle cx="${s.cx}" cy="${s.cy}" r="24" fill="${fill}" stroke="${s.c1}" stroke-width="2.5"/>
        <circle cx="${s.cx}" cy="${s.cy}" r="28" fill="none" stroke="${s.c1}" stroke-width="2.5" opacity=".5"
          stroke-dasharray="${arc} ${CIRC}" transform="rotate(-90 ${s.cx} ${s.cy})" stroke-linecap="round"/>`;
    } else {
      nodes += `
        <circle cx="${s.cx}" cy="${s.cy+4}" r="24" fill="#0c0c14" opacity=".9"/>
        <circle cx="${s.cx}" cy="${s.cy}" r="24" fill="#1c1c26" stroke="#2a2a36" stroke-width="1.5"/>`;
    }

    const lc = (isComplete || isActive) ? s.c1 : '#363646';
    const fw = (isComplete || isActive) ? '600' : 'normal';
    nodes += `<text x="${s.lx}" y="${s.ly}" text-anchor="${s.ta}" font-size="10" fill="${lc}" letter-spacing="0.3" font-family="'Open Sans',sans-serif" font-weight="${fw}">${s.name}</text>`;
  });

  const centerText = isAllDone
    ? `<text x="120" y="112" text-anchor="middle" font-family="serif" font-size="12" fill="#ffe060" letter-spacing="1">全完了</text>`
    : `<text x="120" y="108" text-anchor="middle" font-size="10" fill="#4a4a5a" font-family="'Open Sans',sans-serif">Phase ${currentPhase+2}/${spiritPlan.length+1}</text>
       <text x="120" y="123" text-anchor="middle" font-size="9"  fill="#3a3a48" font-family="'Open Sans',sans-serif">${count}/21日</text>`;

  const activeSP = SP.find(s => s.id === spiritPlan[currentPhase]);
  const statusText = isAllDone
    ? `<span style="color:#ffe060">✓ 道場全完了</span>`
    : activeSP
      ? (isWaiting
          ? `<span style="color:${activeSP.c1}">⏳ 振り返り待ち — ${activeSP.name}</span>`
          : `<span style="color:${activeSP.c1}">⚔️ 稽古中 — ${activeSP.name}</span>`)
      : '';

  el.innerHTML = `
    <svg viewBox="-40 -15 320 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:310px;display:block;margin:0 auto;overflow:visible">
      <defs>${defs}</defs>
      <polygon points="${pts}" fill="rgba(201,168,76,.025)" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>
      ${centerText}
      ${nodes}
    </svg>
    <div class="pentagon-status">${statusText}</div>`;
}

/* ── Render ── */
function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  const info       = SPIRIT_INFO[currentSpirit] || { name: '—', en: '—' };
  const phaseNum   = currentPhase + 2;   // 入門(Phase 1)を含めてカウント
  const totalPhase = (spiritPlan.length || 4) + 1; // 入門+道場の合計
  const count      = stampedDays.size;
  const status     = dojoData.phaseStatus;

  document.getElementById('phase-badge').textContent  = `Phase ${phaseNum}/${totalPhase} — ${info.name}`;
  document.getElementById('spirit-name').textContent  = info.name;
  document.getElementById('spirit-en').textContent    = info.en;
  document.getElementById('stamped-count').textContent = count;
  document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

  renderRankBadge();
  renderPentagonCompass();

  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();

  if (status === 'waiting_review' || status === 'completed') {
    showPhaseComplete(status, info.name);
    document.getElementById('reflection-area').innerHTML = '';
  } else if (todayDay >= 1 && todayDay <= 21) {
    renderReflection(todayDay);
  } else {
    // ?day= なし → phaseStartedAt / dojoStartedAt から今日の日数を算出
    let computedDay = null;
    if (dojoData.phaseStatus === 'active') {
      const refTs = dojoData.phaseStartedAt || dojoData.dojoStartedAt;
      if (refTs) {
        const startLocal = refTs.toDate();
        startLocal.setHours(0, 0, 0, 0);
        const todayLocal = new Date();
        todayLocal.setHours(0, 0, 0, 0);
        const diff = Math.floor((todayLocal - startLocal) / 86400000);
        computedDay = Math.max(1, Math.min(21, diff + 1));
      } else {
        computedDay = 1;
      }
    }
    if (computedDay) {
      renderReflection(computedDay);
    } else {
      document.getElementById('reflection-area').innerHTML = `
        <div style="text-align:center;padding:1rem 1.5rem">
          <div style="font-size:.8rem;color:var(--muted)">LINEのメッセージのリンクから<br>今日の稽古を記録してください。</div>
        </div>`;
    }
  }
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth + 1}月`;

  const firstDay   = new Date(calYear, calMonth, 1);
  const lastDay    = new Date(calYear, calMonth + 1, 0);
  const startDow   = firstDay.getDay();
  const todayStr   = dateToStr(new Date());
  const periodStartStr = startDate ? dateToStr(startDate) : null;
  const periodEndStr   = startDate ? dateToStr(addDays(startDate, 20)) : null;
  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  let html = '';
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dow     = (startDow + d - 1) % 7;
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const inPeriod     = periodStartStr && dateStr >= periodStartStr && dateStr <= periodEndStr;
    const entry        = dateEntryMap[dateStr];
    const isCompleted  = !!entry;
    const isTodayPractice = dateStr === todayPracticeStr;
    const isSelected   = dateStr === selectedDateStr;
    const isPast       = dateStr < todayStr;

    let dayNum = null;
    if (inPeriod && startDate) {
      dayNum = Math.round((localDate(dateStr) - startDate) / 86400000) + 1;
    }

    // 穴埋め猶予判定: 前後どちらにも記録があり、かつ2日以上連続で空白ではない日
    const isGraceDay = inPeriod && isPast && !isCompleted && dayNum !== null && (() => {
      if (stampedDays.has(dayNum)) return false;
      // 前後1日以内に記録があり、かつ連続した2日空白ではないこと
      const hasBefore = stampedDays.has(dayNum - 1);
      const hasAfter  = stampedDays.has(dayNum + 1);
      const noDoubleGap = !(!stampedDays.has(dayNum - 1) && !stampedDays.has(dayNum - 2));
      return (hasBefore || hasAfter) && noDoubleGap;
    })();

    let icon = '';
    if (isCompleted && dayNum && (dayNum === 7 || dayNum === 14 || dayNum === 21)) {
      icon = `<div class="cal-icon"><span class="cal-star">⭐</span></div>`;
    } else if (isCompleted) {
      icon = `<div class="cal-icon"><div class="cal-check">✓</div></div>`;
    } else if (isTodayPractice) {
      icon = `<div class="cal-icon"><div class="cal-dot gold-dot"></div></div>`;
    } else if (isGraceDay) {
      icon = `<div class="cal-icon"><div class="cal-dot grace-dot"></div></div>`;
    } else if (inPeriod && isPast) {
      icon = `<div class="cal-icon"><div class="cal-dot gray-dot"></div></div>`;
    }

    let cls = 'cal-cell';
    if (!inPeriod) cls += ' out-period';
    else {
      cls += ' in-period';
      if (isCompleted)                       cls += ' completed';
      if (isTodayPractice && !isCompleted)   cls += ' today-unrecorded';
      if (isGraceDay)                        cls += ' grace-day';
      if (isSelected)                        cls += ' selected';
    }
    if (dow === 0) cls += ' sun-col';
    if (dow === 6) cls += ' sat-col';

    const click = inPeriod ? `onclick="selectCalDate('${dateStr}',${dayNum})"` : '';
    html += `<div class="${cls}" ${click}>
      <span class="cal-num">${d}</span>${icon}
    </div>`;
  }

  const totalCells = startDow + lastDay.getDate();
  const rem = totalCells % 7;
  if (rem) for (let i = 0; i < 7 - rem; i++) html += `<div class="cal-cell"></div>`;

  document.getElementById('cal-grid').innerHTML = html;

  const streak    = calcStreak();
  const maxStreak = calcMaxStreak();
  const count     = stampedDays.size;
  const bar       = document.getElementById('streak-bar');

  // 今日未記録かどうか（streak-preview 用）
  const todayRecorded = todayDay >= 1 && stampedDays.has(todayDay);

  // 次の節目（7/14/21）を求める
  const MILESTONES = [7, 14, 21];
  const nextMilestone = MILESTONES.find(m => count < m) || 21;
  const prevMilestone = MILESTONES.slice().reverse().find(m => count >= m) || 0;
  const milestoneProgress = nextMilestone - prevMilestone;
  const milestoneCount    = count - prevMilestone;
  const milestoneLeft     = nextMilestone - count;
  const progressPct       = Math.min(100, Math.round(milestoneCount / milestoneProgress * 100));

  const isRecord = streak > 0 && streak >= maxStreak;

  if (streak >= 1 || count > 0) {
    const flameNum = Math.min(streak, 5);
    const flames   = streak >= 2 ? '🔥'.repeat(flameNum) : '🕯';
    const badgeText = isRecord && streak >= 2 ? '最高記録更新中' : streak >= 2 ? `最高 ${maxStreak}日` : '';

    bar.innerHTML = `
      <div class="streak-main">
        <span class="streak-flames">${flames}</span>
        <div>
          <span class="streak-num">${streak}</span>
          <span class="streak-unit">日連続</span>
        </div>
        ${badgeText ? `<span class="streak-badge">${badgeText}</span>` : ''}
      </div>
      ${count < 21 ? `
        <div class="streak-next">次の節目 Day ${nextMilestone} まであと ${milestoneLeft} 日</div>
        <div class="streak-progress-track">
          <div class="streak-progress-fill" style="width:${progressPct}%"></div>
        </div>
      ` : ''}
      ${!todayRecorded && todayDay >= 1 ? (() => {
        const nextStreak = calcStreakIfToday(todayDay);
        const gapNote = !stampedDays.has(todayDay - 1) && stampedDays.has(todayDay - 2)
          ? ' （昨日の空白を埋める）' : '';
        return `<div class="streak-preview">今日記録すると ${nextStreak}日連続 🔥${gapNote}</div>`;
      })() : ''}
    `;
    bar.style.display = 'block';
  } else {
    bar.style.display = 'none';
  }
}

function selectCalDate(dateStr, dayNum) {
  selectedDateStr = dateStr;
  renderCalendar();

  const entry = dateEntryMap[dateStr];
  const d = localDate(dateStr);
  const DOW = ['日','月','火','水','木','金','土'];
  const label = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;

  const wrap = document.getElementById('day-detail-wrap');
  const area = document.getElementById('day-detail-area');

  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  if (dateStr === todayPracticeStr && !entry) {
    wrap.style.display = 'none';
    document.getElementById('reflection-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }

  wrap.style.display = '';

  if (entry) {
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span class="done-badge">✓ Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text">
          ${entry.text ? escHtml(entry.text).replace(/\n/g,'<br>') : '<span style="color:var(--muted)">（振り返りの記録なし）</span>'}
        </div>
      </div>`;
  } else {
    const isPast = dateStr < dateToStr(new Date());
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span style="font-size:.68rem;color:var(--muted)">Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text" style="color:var(--muted)">
          ${isPast ? 'この日の記録はありません。' : '稽古の日を楽しみに。'}
        </div>
      </div>`;
  }

  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

/* ── Reflection form ── */
function renderReflection(day) {
  const area = document.getElementById('reflection-area');

  if (stampedDays.has(day)) {
    const entry = phaseEntries.find(e => e.day === day);
    // ファシリテーターからのコメント（武蔵BOT経由）
    const musashiMsg = (dojoData?.musashiMessages || [])
      .find(m => m.phase === currentPhase && m.day === day);
    const commentHtml = musashiMsg ? `
      <div class="facilitator-comment">
        <div class="facilitator-comment-label">⚔️ ファシリテーターより</div>
        <div class="facilitator-comment-text">${escHtml(musashiMsg.message).replace(/\n/g,'<br>')}</div>
      </div>` : '';
    area.innerHTML = `
      <div class="reflection-card fade-up">
        <div class="reflection-day-label">DAY ${day} · 記録済み</div>
        <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem">
          <svg width="28" height="28" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="22" stroke="#3a7a4a" stroke-width="2.5"/><polyline points="15,26 22,34 37,17" stroke="#3a7a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size:.88rem;color:var(--cream2)">Day ${day} の稽古を記録しました</span>
        </div>
        ${entry?.text ? `<div style="font-size:.82rem;color:var(--muted);line-height:1.7;padding:.55rem .75rem;background:var(--bg3);border-radius:6px">${escHtml(entry.text).replace(/\n/g,'<br>')}</div>` : ''}
        ${commentHtml}
      </div>`;
    return;
  }

  // ── 21日前の自分との対話 ──────────────────────────────
  let pastSelfHtml = '';
  const allEntries = dojoData?.entries || [];

  if (day === 21) {
    // 最終日：同じSpiritの Day 1 を表示
    const day1Entry = phaseEntries.find(e => e.day === 1 && e.text);
    if (day1Entry) {
      pastSelfHtml = `
        <div class="past-self">
          <div class="past-self-header">
            <span class="past-self-icon">🪞</span>
            <span class="past-self-title">21日前のあなた</span>
            <span class="past-self-day">Day 1</span>
          </div>
          <div class="past-self-text">${escHtml(day1Entry.text.slice(0, 120))}${day1Entry.text.length > 120 ? '…' : ''}</div>
        </div>
        <div class="past-self-divider">↑ 21日前のあなたへ、今日の答えを書く</div>`;
    }
  } else if (day === 1 && currentPhase > 0) {
    // 新Phase Day 1：前のSpiritの Day 21 を表示
    const prevPhase = currentPhase - 1;
    const prevDay21 = allEntries.find(e => e.phase === prevPhase && e.day === 21 && e.text);
    const prevSpirit = (dojoData?.spiritPlan || [])[prevPhase];
    const prevSpiritName = SPIRIT_INFO[prevSpirit]?.name || '前のSpirit';
    if (prevDay21) {
      pastSelfHtml = `
        <div class="past-self">
          <div class="past-self-header">
            <span class="past-self-icon">🪞</span>
            <span class="past-self-title">${prevSpiritName}の最終日に書いたこと</span>
            <span class="past-self-day">Day 21</span>
          </div>
          <div class="past-self-text">${escHtml(prevDay21.text.slice(0, 120))}${prevDay21.text.length > 120 ? '…' : ''}</div>
        </div>
        <div class="past-self-divider">↑ あの日からここへ来た。今日は何を感じるか？</div>`;
    }
  }

  // 今日の意図（朝のLINE返信）
  const intentData = dojoData?.todayIntent;
  const intentHtml = (intentData && intentData.day === day) ? `
    <div class="today-intent">
      <div class="today-intent-icon">💭</div>
      <div class="today-intent-body">
        <div class="today-intent-label">今日の意図</div>
        <div class="today-intent-text">${escHtml(intentData.text)}</div>
      </div>
    </div>` : '';

  // 過去記録の引用を探す（7日前→14日前→3日前→1日前の順で優先）
  const LOOK_BACK = [7, 14, 3, 1];
  let pastEntry = null;
  let pastDaysAgo = 0;
  for (const delta of LOOK_BACK) {
    const pastDay = day - delta;
    if (pastDay >= 1) {
      const e = phaseEntries.find(e => e.day === pastDay && e.text);
      if (e) { pastEntry = e; pastDaysAgo = delta; break; }
    }
  }

  const pastQuoteHtml = pastEntry ? `
    <div class="past-quote">
      <div class="past-quote-label">${pastDaysAgo}日前（Day ${day - pastDaysAgo}）の記録</div>
      <div class="past-quote-text">${escHtml(pastEntry.text.slice(0, 80))}${pastEntry.text.length > 80 ? '…' : ''}</div>
    </div>` : '';

  const QCI = [
    { icon: '🌿', label: '静かな\n一歩だった',  value: '静かな一歩だった。' },
    { icon: '💡', label: '新たな\n気づきがあった', value: '新たな気づきがあった。' },
    { icon: '⚔️', label: '力を\n出せた',       value: '力を出せた稽古だった。' },
  ];

  area.innerHTML = `
    <div class="reflection-card fade-up">
      <div class="reflection-day-label">DAY ${day} · 今日の気づき</div>
      <div class="reflection-title">稽古の振り返り</div>
      ${pastSelfHtml}
      ${intentHtml}
      ${pastQuoteHtml}

      <div class="quick-checkin">
        ${QCI.map((q, i) => `
          <button class="qci-btn" id="qci-${i}" onclick="selectQci(${i}, ${day})" type="button">
            <div class="qci-icon">${q.icon}</div>
            <div class="qci-label">${q.label.replace('\n','<br>')}</div>
          </button>`).join('')}
      </div>

      <div class="qci-or">— または自由に書く —</div>
      <textarea class="reflection-textarea" id="reflection-text"
        placeholder="今日の稽古から何を感じましたか？" rows="3"
        oninput="onReflectionInput()"></textarea>
      <div style="font-size:.78rem;color:var(--muted);margin:.35rem 0 .6rem">ファシリテーターに届きます</div>
      <button class="btn-submit" id="submit-btn" onclick="submitPractice(${day})" disabled>
        ⚔️ 稽古を記録する
      </button>
    </div>`;
}

const QCI_VALUES = [
  '静かな一歩だった。',
  '新たな気づきがあった。',
  '力を出せた稽古だった。',
];
let _selectedQci = -1;

function selectQci(idx, day) {
  _selectedQci = idx;
  [0,1,2].forEach(i => {
    document.getElementById(`qci-${i}`)?.classList.toggle('selected', i === idx);
  });
  // textarea に選択肢の文言を反映（上書き可能）
  const ta = document.getElementById('reflection-text');
  if (ta && (!ta.value || QCI_VALUES.includes(ta.value))) {
    ta.value = QCI_VALUES[idx];
  }
  document.getElementById('submit-btn').disabled = false;
}

function onReflectionInput() {
  const val = document.getElementById('reflection-text')?.value || '';
  // QCI 選択を外す（自由入力が優先）
  if (val && !QCI_VALUES.includes(val)) {
    _selectedQci = -1;
    [0,1,2].forEach(i => document.getElementById(`qci-${i}`)?.classList.remove('selected'));
  }
  document.getElementById('submit-btn').disabled = val.trim().length === 0 && _selectedQci < 0;
}

function showCompleteAnimation(day, streakCount) {
  const SPIRIT_INFO_LOCAL = {
    hei: { kanji: '平' }, jiko: { kanji: '鍛' }, flex: { kanji: '適' },
    strat: { kanji: '謀' }, sei: { kanji: '誠' },
  };
  const overlay   = document.getElementById('complete-overlay');
  const card      = document.getElementById('complete-card');
  const quote     = MUSASHI_QUOTES[Math.floor(Math.random() * MUSASHI_QUOTES.length)];
  const kanji     = SPIRIT_INFO_LOCAL[currentSpirit]?.kanji || '⚔';
  const milestone = MILESTONE_DATA[day] || null;

  // 節目バナー
  if (milestone) {
    document.getElementById('milestone-roman').textContent    = milestone.roman;
    document.getElementById('milestone-headline').textContent = milestone.headline;
    document.getElementById('milestone-sub').textContent      = milestone.sub;
    overlay.classList.add('milestone');
  } else {
    overlay.classList.remove('milestone');
  }

  document.getElementById('complete-kanji').textContent  = kanji;
  document.getElementById('complete-day').textContent    = `Day ${day}`;
  document.getElementById('complete-streak').textContent = streakCount >= 2 ? `🔥 ${streakCount}日連続` : '';
  document.getElementById('complete-quote').textContent  = `「${quote.text}」`;
  document.getElementById('complete-author').textContent = '— 宮本武蔵';

  overlay.classList.remove('hide');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.classList.add('show');
      if (milestone) setTimeout(() => spawnMilestoneStars(card), 600);
    });
  });

  _completeOverlayTimer = setTimeout(() => dismissCompleteOverlay(), milestone ? 12000 : 8000);
}

function dismissCompleteOverlay() {
  if (_completeOverlayTimer) { clearTimeout(_completeOverlayTimer); _completeOverlayTimer = null; }
  const overlay = document.getElementById('complete-overlay');
  overlay.classList.remove('show');
  overlay.classList.add('hide');
}

async function submitPractice(day) {
  const textEl = document.getElementById('reflection-text');
  const text   = textEl?.value?.trim() || '';
  const btn    = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '記録中...' }

  const entry = {
    day,
    phase: currentPhase,
    spirit: currentSpirit,
    text,
    timestamp: new Date().toISOString()
  };

  try {
    await db.collection('dojo_practices').doc(userId).set({
      entries: firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    stampedDays.add(day);
    phaseEntries.push({ ...entry, timestamp: new Date() });
    buildDateEntryMap();

    const count = stampedDays.size;
    document.getElementById('stamped-count').textContent = count;
    document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;
    renderRankBadge();

    // 連続日数を計算してアニメーション表示（1日穴埋め猶予込み）
    const streak = calcStreakFrom(stampedDays, day);
    showCompleteAnimation(day, streak);

    // 仲間カウントをインクリメント（非同期・失敗しても続行）
    db.collection('dojo_stats').doc(todayJstKey()).set(
      { count: firebase.firestore.FieldValue.increment(1) },
      { merge: true }
    ).then(() => {
      fellowCount++;
      updateFellowBanner();
    }).catch(() => {});

    renderCalendar();
    renderReflection(day);
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '⚔️ 稽古を記録する' }
    alert('記録に失敗しました。もう一度お試しください。');
  }
}

    '直感と戦略、どちらを優先したか？それは正しかったか？',

    '次のSpiritを磨く上で、戦略的思考はどう役立つか？',
  ],
  sei: [
    '今日、自分の言葉と行動は一致していたか？',
    '誠実であることのコストを、21日間で感じた場面はあったか？',
    '「誠実さ」を最もよく体現できた瞬間はいつか？',
    '自分に不誠実だった瞬間があるとしたら、それはいつか？',
    '次のSpiritに誠実さをどう持ち込むか？',
  ],
};

/* ── Phase complete screen ── */
function showPhaseComplete(status, spiritName) {
  const area = document.getElementById('phase-complete-area');

  if (status === 'completed') {
    area.innerHTML = `
      <div class="waiting-card fade-up">
        <div style="font-size:2rem;margin-bottom:.7rem">⚔️</div>
        <div class="waiting-title">すべての稽古、完了。</div>
        <div class="waiting-desc">
          ${spiritPlan.length}つのSpiritの鍛錬を修めた。<br>
          これからは、あなた自身が道を切り拓いていく。<br><br>
          <em>千日の稽古を鍛とし、万日の稽古を錬とす。</em><br>
          <span style="font-size:.75rem;color:var(--muted)">— 宮本武蔵</span>
        </div>
      </div>`;
  } else {
    const calUrl = 'https://cal.com/samurai-in-you/21dayafterfeedback';

    // 今日の「間の問い」を日数から選ぶ（0〜4をループ）
    const prompts = WAITING_PROMPTS[currentSpirit] || WAITING_PROMPTS.hei;
    const waitingStartTs = dojoData.phaseCompletedAt || dojoData.phaseStartedAt;
    let promptIdx = 0;
    if (waitingStartTs) {
      const daysSinceComplete = Math.floor(
        (new Date() - waitingStartTs.toDate()) / 86400000
      );
      promptIdx = Math.min(Math.max(0, daysSinceComplete), prompts.length - 1);
    }
    const todayPrompt = prompts[promptIdx];

    // 次の Spirit を取得
    const nextSpirit = spiritPlan[currentPhase + 1] || null;
    const nextInfo   = nextSpirit ? (SPIRIT_INFO[nextSpirit] || {}) : null;
    const nextLine   = nextInfo
      ? `<div class="waiting-next-spirit">次の稽古：Phase ${currentPhase + 3}「${nextInfo.name}」</div>`
      : '';

    area.innerHTML = `
      <div class="waiting-card fade-up">
        <div style="font-size:1.5rem;margin-bottom:.6rem">⚔️</div>
        <div class="waiting-title">「${spiritName}」の稽古、完了。</div>
        <div class="waiting-desc">
          21日間、続けた。<br>それだけで、すでに侍だ。
        </div>

        <div class="waiting-interim-prompt">
          <div class="waiting-interim-label">間の稽古 — 今日の問い</div>
          <div class="waiting-interim-q">${escHtml(todayPrompt)}</div>
        </div>

        <a href="${calUrl}" class="cal-link" target="_blank">
          📅 振り返りミーティングを予約する
        </a>
        ${nextLine}
      </div>`;
  }

  area.style.display = '';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-msg').innerHTML = msg;
}

init();
</script>
