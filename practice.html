<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>稽古の記録 — SAMURAI in You</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy:      #132844;
  --ink:       #15283f;
  --bg:        #f4f6f9;
  --bg2:       #ffffff;
  --bg3:       #eef1f5;
  --cream:     #15283f;
  --cream2:    #4a5a6a;
  --muted:     #758293;
  --gold:      #e2b84a;
  --gold2:     #c9a030;
  --gold-dim:  rgba(226,184,74,.12);
  --red:       #8b1a1a;
  --border:    #e5eaf0;
  --line:      #e5eaf0;
  --green:     #3a7a4a;
  --green-dim: rgba(58,122,74,.18);
  --r:         12px;
  --font:      'Noto Sans JP', sans-serif;
  --font-b:    'Barlow Condensed', sans-serif;
  --font-brush: 'Cormorant Garamond', serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 3rem;
}

/* ── Header ── */
.page-header {
  text-align: center;
  padding: 1.4rem 1.2rem .9rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.logo-img { width: 38px; height: 38px; object-fit: contain; margin-bottom: .35rem }
.page-title {
  font-family: var(--font-b);
  font-size: .9rem;
  letter-spacing: .22em;
  color: var(--navy);
  font-weight: 700;
}

/* ── Rank Strip ── */
.rank-strip {
  display: flex;
  align-items: center;
  gap: .9rem;
  padding: .9rem 1.3rem;
  border-bottom: 1px solid var(--line);
  max-width: 480px;
  margin: 0 auto;
}
.rank-strip-mon { width: 44px; height: 44px; flex-shrink: 0 }
.rank-strip-mon svg { width: 100%; height: 100% }
.rank-strip-info { flex-shrink: 0 }
.rank-strip-name {
  font-family: var(--font-b);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: .06em;
  line-height: 1;
}
.rank-strip-sub {
  font-size: .6rem;
  color: var(--muted);
  letter-spacing: .15em;
  margin-top: .15rem;
}
.rank-strip-progress { flex: 1; min-width: 0 }
.rank-strip-progress-label {
  display: flex;
  justify-content: space-between;
  font-size: .68rem;
  color: var(--muted);
  margin-bottom: .28rem;
}
.pcount { color: var(--gold); font-weight: 600 }
.progress-bar-bg {
  height: 5px;
  background: var(--bg3);
  border-radius: 100px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold2), var(--gold));
  border-radius: 100px;
  transition: width .6s ease;
}

/* ── Section wrap ── */
.sw { padding: .75rem 1.2rem; max-width: 480px; margin: 0 auto }

/* ── Calendar Card ── */
.cal-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: .85rem .75rem .5rem;
}
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .55rem;
}
.cal-month-label {
  font-family: var(--font-b);
  font-size: .95rem;
  color: var(--navy);
  letter-spacing: .04em;
  font-weight: 700;
}
.cal-nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4rem;
  cursor: pointer;
  padding: .1rem .5rem;
  border-radius: 6px;
  line-height: 1;
  transition: color .15s, background .15s;
}
.cal-nav-btn:hover { color: var(--gold); background: var(--gold-dim) }
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: .2rem;
}
.cal-wd {
  text-align: center;
  font-size: .6rem;
  color: var(--muted);
  padding: .12rem 0;
}
.cal-wd:first-child { color: #b06060 }
.cal-wd:last-child  { color: #6090b0 }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: .12rem;
}
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: .3rem;
  height: 44px;
  border-radius: 50%;
  cursor: default;
  position: relative;
  transition: background .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.cal-cell.in-period { cursor: pointer }
.cal-cell.in-period:active { background: rgba(201,168,76,.12) }
.cal-cell.selected {
  box-shadow: 0 0 0 2px var(--gold);
  background: rgba(201,168,76,.07);
}
.cal-cell.today-unrecorded { background: rgba(201,168,76,.1) }
.cal-num {
  font-size: .8rem;
  line-height: 1;
  color: var(--cream2);
  display: block;
}
.cal-cell.out-period .cal-num { color: rgba(0,0,0,.18) }
.cal-cell.sun-col .cal-num   { color: #c08080 }
.cal-cell.sat-col .cal-num   { color: #7090b8 }
.cal-cell.completed .cal-num { color: var(--cream) }
.cal-cell.today-unrecorded .cal-num { color: var(--gold) }

/* Icons */
.cal-icon { margin-top: 2px; display: flex; align-items: center; justify-content: center }
.cal-check {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: .56rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
}
.cal-dot { width: 5px; height: 5px; border-radius: 50% }
.gold-dot { background: var(--gold) }
.gray-dot { background: var(--muted); opacity: .45 }
.cal-star  { font-size: .68rem; line-height: 1 }

/* Legend */
.cal-legend {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .55rem .2rem .1rem;
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: .28rem;
  font-size: .62rem;
  color: var(--muted);
}

/* ── Streak Hero ── */
.streak-hero { max-width: 480px; margin: 0 auto; padding: .55rem 1.2rem }
.streak-hero-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.3rem 1.2rem 1.1rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.streak-hero-card.active::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.09) 0%, transparent 65%);
  pointer-events: none;
}
.streak-num-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  margin-bottom: .15rem;
}
.streak-big-num {
  font-family: var(--font-b);
  font-size: 3.6rem;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
  letter-spacing: -.02em;
}
.streak-big-num.zero { color: var(--muted) }
.streak-sword-icon { font-size: 2rem; line-height: 1; display: inline-block }
.streak-sword-icon.fire { animation: swordPulse 2.2s ease-in-out infinite }
.streak-unit {
  font-family: var(--font-b);
  font-size: .82rem;
  color: var(--cream2);
  letter-spacing: .12em;
  margin-bottom: .85rem;
}
/* milestone row */
.streak-milestones {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 0 .7rem;
}
.ms-item { display: flex; flex-direction: column; align-items: center; gap: .18rem }
.ms-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--bg3);
  border: 2px solid rgba(201,168,76,.2);
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem;
  color: var(--muted);
  transition: all .35s;
}
.ms-dot.reached {
  background: var(--gold);
  border-color: var(--gold);
  color: #1a1a1f;
  font-weight: 700;
  box-shadow: 0 0 8px rgba(201,168,76,.45);
  animation: msPop .4s cubic-bezier(.36,1.6,.5,1) forwards;
}
.ms-label { font-size: .58rem; color: var(--muted); letter-spacing: .04em }
.ms-label.reached { color: var(--gold) }
.ms-line {
  flex: 1; height: 2px; background: rgba(201,168,76,.15);
  min-width: 24px; max-width: 52px; margin: 0 1px;
  margin-bottom: 14px;
}
.ms-line.reached { background: var(--gold); box-shadow: 0 0 4px rgba(201,168,76,.3) }
.streak-msg {
  font-size: .76rem;
  color: var(--cream2);
  letter-spacing: .03em;
  min-height: 1.1rem;
}
@keyframes swordPulse {
  0%, 100% { transform: rotate(-5deg) scale(1) }
  50%       { transform: rotate(5deg)  scale(1.12) }
}
@keyframes msPop {
  0%   { transform: scale(.6) }
  100% { transform: scale(1) }
}

/* ── Pentagon Compass ── */
.pentagon-section { max-width: 480px; margin: 0 auto; padding: .55rem 1.2rem }
.pentagon-card {
  background: var(--navy);
  border: 1px solid var(--navy);
  border-radius: var(--r);
  padding: 1rem .5rem .8rem;
}
.pentagon-title {
  text-align: center;
  font-family: var(--font-b);
  font-size: .66rem;
  letter-spacing: .22em;
  color: rgba(255,255,255,.45);
  margin-bottom: .3rem;
}
.pentagon-status {
  text-align: center;
  font-size: .75rem;
  letter-spacing: .06em;
  margin-top: .45rem;
  min-height: 1.1rem;
  font-weight: 600;
  color: var(--gold);
}
@keyframes spiritRingPulse {
  0%   { transform: scale(1);    opacity: .65 }
  100% { transform: scale(1.65); opacity: 0   }
}
.spirit-outer-ring {
  transform-box: fill-box;
  transform-origin: center;
  animation: spiritRingPulse 2s ease-out infinite;
}

/* ── Day detail ── */
.day-detail-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.15rem;
  position: relative;
  overflow: hidden;
}
.day-detail-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.day-detail-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .6rem;
}
.day-detail-date {
  font-family: var(--font-b);
  font-size: .92rem;
  color: var(--cream);
  letter-spacing: .03em;
}
.done-badge {
  font-size: .68rem;
  padding: .18rem .55rem;
  border-radius: 100px;
  background: var(--green-dim);
  color: #6dc46d;
  border: 1px solid rgba(58,122,74,.4);
}
.day-reflection-text {
  font-size: .84rem;
  color: var(--cream2);
  line-height: 1.75;
}

/* ── Reflection form ── */
.reflection-section { max-width: 480px; margin: 0 auto; padding: 0 1.2rem .8rem }
.reflection-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1.25rem;
  position: relative;
  overflow: hidden;
}
.reflection-card::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.reflection-day-label {
  font-size: .68rem;
  letter-spacing: .2em;
  color: var(--muted);
  margin-bottom: .28rem;
}
.reflection-title {
  font-family: var(--font-b);
  font-size: 1.05rem;
  color: var(--cream);
  font-weight: 700;
  margin-bottom: .85rem;
}
.reflection-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  font-family: var(--font);
  font-size: .9rem;
  line-height: 1.7;
  padding: .72rem .9rem;
  resize: none;
  min-height: 88px;
  outline: none;
  transition: border-color .2s;
}
.reflection-textarea:focus { border-color: var(--gold) }
.reflection-textarea::placeholder { color: var(--muted) }
.btn-submit {
  display: block;
  width: 100%;
  margin-top: .82rem;
  padding: .78rem;
  background: linear-gradient(135deg, #8b1a1a, #a02020);
  border: none;
  border-radius: 8px;
  color: var(--cream);
  font-family: var(--font-b);
  font-size: .93rem;
  font-weight: 700;
  letter-spacing: .1em;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-submit:hover { opacity: .88 }
.btn-submit:disabled { opacity: .4; cursor: not-allowed }
.already-stamped {
  text-align: center;
  padding: 1rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-size: .86rem;
  color: var(--cream2);
  line-height: 1.7;
}

/* ── Completion ── */
.completion-screen {
  display: none;
  text-align: center;
  padding: 2rem 1.5rem;
  max-width: 480px;
  margin: 0 auto;
}
.completion-screen.visible { display: block }
.completion-mon { width: 90px; height: 90px; margin: 0 auto 1rem }
.completion-title {
  font-family: var(--font-b);
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: .05em;
  margin-bottom: .4rem;
}
.completion-rank {
  font-family: var(--font-b);
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--cream);
  letter-spacing: .1em;
  margin-bottom: .7rem;
}
.completion-divider {
  margin: 1.2rem auto;
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.completion-desc { font-size: .9rem; color: var(--cream2); line-height: 1.8 }

/* ── Loading / Error ── */
.loading-screen { text-align: center; padding: 4rem 1.5rem; color: var(--muted); font-size: .9rem }
.error-screen   { text-align: center; padding: 3rem 1.5rem; color: var(--muted) }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px) }
  to   { opacity: 1; transform: translateY(0) }
}
.fade-up { animation: fadeSlideUp .35s ease forwards }

/* ── Stamp Animation ── */
.stamp-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,6,4,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  pointer-events: none;
  animation: stOverlayIn .2s ease forwards;
}
.stamp-overlay.out { animation: stOverlayOut .5s ease .9s forwards }
.stamp-circle {
  width: 158px;
  height: 158px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  background: var(--bg);
  box-shadow: 0 0 0 1px rgba(201,168,76,.25), 0 0 48px rgba(201,168,76,.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: stCircleIn .38s cubic-bezier(.36,1.55,.5,1) forwards;
}
.stamp-icon {
  font-size: 3.2rem;
  line-height: 1;
  animation: stIconIn .3s cubic-bezier(.36,1.55,.5,1) .15s both;
}
.stamp-label {
  font-family: var(--font-b);
  font-size: .82rem;
  color: var(--gold);
  letter-spacing: .14em;
  margin-top: .3rem;
  animation: stIconIn .3s ease .25s both;
}
.stamp-ring {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid rgba(201,168,76,.5);
  width: 158px; height: 158px;
  top: -3px; left: -3px;
  animation: stRing .7s ease var(--d) both;
}
@keyframes stOverlayIn  { from { opacity:0 } to { opacity:1 } }
@keyframes stOverlayOut { from { opacity:1 } to { opacity:0 } }
@keyframes stCircleIn {
  from { transform: scale(.3) rotate(-18deg); opacity:0 }
  to   { transform: scale(1)  rotate(0deg);  opacity:1 }
}
@keyframes stIconIn {
  from { transform: scale(0); opacity:0 }
  to   { transform: scale(1); opacity:1 }
}
@keyframes stRing {
  from { transform: scale(1);   opacity:.7 }
  to   { transform: scale(2.1); opacity:0  }
}
/* ── Catch-ball conversation thread ── */
.conv-thread { display:flex; flex-direction:column; gap:.7rem; margin-bottom:.6rem }
.conv-block { padding:.7rem .95rem; border-radius:10px; font-size:.82rem; line-height:1.7 }
.conv-label { font-size:.6rem; letter-spacing:.12em; color:var(--muted); margin-bottom:.28rem; text-transform:uppercase }
.conv-challenge { background:rgba(201,168,76,.05); border:1px solid rgba(201,168,76,.22) }
.conv-participant { background:var(--bg3); border:1px solid var(--line) }
.conv-musashi { background:rgba(139,26,26,.07); border:1px solid rgba(201,168,76,.2) }
.conv-musashi .conv-label { color:var(--gold); letter-spacing:.1em }
.conv-followup-wrap { padding:.85rem .95rem; background:rgba(201,168,76,.03); border:1px solid rgba(201,168,76,.18); border-radius:10px; margin-top:.1rem }
</style>
</head>
<body>

<div class="page-header">
  <img src="logo.png" alt="SAMURAI in You" class="logo-img">
  <div class="page-title">稽古の記録</div>
  <div id="report-link-area" style="margin-top:.55rem;display:none">
    <a id="report-link" href="#" style="font-size:.72rem;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,.35);padding:.26rem .72rem;border-radius:100px;display:inline-block">
      📜 自分の記録・メモを見る
    </a>
  </div>
</div>

<div class="loading-screen" id="loading">読み込み中...</div>

<div id="main-content" style="display:none">

  <!-- Rank strip -->
  <div class="rank-strip">
    <div class="rank-strip-mon" id="rank-mon"></div>
    <div class="rank-strip-info">
      <div class="rank-strip-name" id="rank-name">見習い</div>
      <div class="rank-strip-sub"  id="rank-sub">MINARAI</div>
    </div>
    <div class="rank-strip-progress">
      <div class="rank-strip-progress-label">
        <span>修行の進捗</span>
        <span class="pcount"><span id="stamped-count">0</span> / 21 日</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Streak Hero -->
  <div class="streak-hero" id="streak-hero"></div>

  <!-- Pentagon Compass -->
  <div class="pentagon-section">
    <div class="pentagon-card">
      <div class="pentagon-title">PENTAGON COMPASS</div>
      <div id="pentagon-compass"></div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="sw">
    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <div class="cal-wd">日</div><div class="cal-wd">月</div>
        <div class="cal-wd">火</div><div class="cal-wd">水</div>
        <div class="cal-wd">木</div><div class="cal-wd">金</div>
        <div class="cal-wd">土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <div class="legend-item"><div class="cal-check" style="width:12px;height:12px;font-size:.5rem">✓</div><span>稽古完了</span></div>
        <div class="legend-item"><div class="cal-dot gold-dot"></div><span>今日の稽古</span></div>
        <div class="legend-item"><div class="cal-dot gray-dot"></div><span>未記録</span></div>
        <div class="legend-item"><span class="cal-star">⭐</span><span>連続達成</span></div>
      </div>
    </div>
  </div>

  <!-- Past day detail -->
  <div class="sw" id="day-detail-wrap" style="display:none">
    <div id="day-detail-area"></div>
  </div>

  <!-- Rank history -->
  <div id="rank-history-area"></div>

  <!-- Today's reflection -->
  <div class="reflection-section" id="reflection-area"></div>

  <!-- Completion -->
  <div class="completion-screen" id="completion-screen"></div>

</div>

<div class="error-screen" id="error-screen" style="display:none">
  <div style="font-size:1.5rem;margin-bottom:.8rem">⚠️</div>

  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function localDate(str) {
  // Parse YYYY-MM-DD as local time
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* ── Init ── */
async function init() {
  if (!userId) { showError('LINEのメッセージからアクセスしてください。'); return; }
  const rl = document.getElementById('report-link');
  if (rl) { rl.href = `report.html?lid=${userId}`; document.getElementById('report-link-area').style.display = ''; }
  try {
    const [doc, liteSnap] = await Promise.all([
      db.collection('practices').doc(userId).get(),
      db.collection('lite_results').doc(userId).get()
    ]);
    practiceData = doc.exists ? doc.data() : { lineUserId: userId, entries: [], cycle: 1 };
    liteSpirit = liteSnap.exists ? liteSnap.data().spirit : null;
    (practiceData.entries || []).forEach(e => stampedDays.add(e.day));
    computeStartDate();
    buildDateEntryMap();
    render();
  } catch(e) {
    console.error(e);
    showError('データの読み込みに失敗しました。');
  }
}

function computeStartDate() {
  const entries = practiceData.entries || [];
  // Day 1 entry timestamp
  const d1 = entries.find(e => e.day === 1);
  if (d1?.timestamp) {
    const d = new Date(d1.timestamp);
    startDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return;
  }
  // Earliest entry
  if (entries.length) {
    const earliest = [...entries].sort((a,b) => a.day - b.day)[0];
    if (earliest.timestamp) {
      const d = new Date(earliest.timestamp);
      const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      base.setDate(base.getDate() - (earliest.day - 1));
      startDate = base;
      return;
    }
  }
  // todayDay URL param
  if (todayDay >= 1) {
    const t = new Date();
    const base = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    base.setDate(base.getDate() - (todayDay - 1));
    startDate = base;
    return;
  }
  const t = new Date();
  startDate = new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

function buildDateEntryMap() {
  dateEntryMap = {};
  if (!startDate) return;
  (practiceData.entries || []).forEach(e => {
    if (!e.day) return;
    const d = addDays(startDate, e.day - 1);
    dateEntryMap[dateToStr(d)] = e;
  });
}

function calcStreak() {
  if (!stampedDays.size) return 0;
  const sorted = [...stampedDays].sort((a,b) => b - a);
  let streak = 1;
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === sorted[i-1] - 1) streak++;
    else break;
  }
  return streak;
}

function calcMaxStreak() {
  if (!stampedDays.size) return 0;
  const sorted = [...stampedDays].sort((a,b) => a - b);
  let max = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    cur = (sorted[i] === sorted[i-1] + 1) ? cur + 1 : 1;
    if (cur > max) max = cur;
  }
  return max;
}

/* ── Streak Hero ── */
function renderStreakHero() {
  const streak    = calcStreak();
  const maxStreak = calcMaxStreak();
  const MILESTONES = [3, 7, 14, 21];
  const MESSAGES = [
    [21, '二十一日。一本の軸が立った。'],
    [14, '十四日。平常心が育っている。'],
    [7,  '七日。侍の心が宿りつつある。'],
    [3,  '三日続けた。軸が芽生えはじめている。'],
    [1,  '稽古の第一歩を踏み出した。'],
    [0,  '今日から稽古を始めましょう。'],
  ];
  let msg = MESSAGES[MESSAGES.length - 1][1];
  for (const [t, text] of MESSAGES) { if (streak >= t) { msg = text; break; } }

  const msHtml = MILESTONES.map((m, i) => {
    const reached = streak >= m;
    const lineHtml = i < MILESTONES.length - 1
      ? `<div class="ms-line${streak >= MILESTONES[i] ? ' reached' : ''}"></div>` : '';
    return `<div class="ms-item">
      <div class="ms-dot${reached ? ' reached' : ''}">${reached ? '✓' : m}</div>
      <div class="ms-label${reached ? ' reached' : ''}">${m}日</div>
    </div>${lineHtml}`;
  }).join('');

  const isActive = streak >= 2;
  const isFire   = streak >= 7;
  const maxNote  = maxStreak > streak && maxStreak >= 2
    ? `<span style="font-size:.62rem;color:var(--muted);margin-left:.5rem">最高: ${maxStreak}日</span>` : '';

  document.getElementById('streak-hero').innerHTML = `
    <div class="streak-hero-card${isActive ? ' active' : ''}">
      <div class="streak-num-row">
        <span class="streak-sword-icon${isFire ? ' fire' : ''}">⚔️</span>
        <span class="streak-big-num${streak === 0 ? ' zero' : ''}">${streak}</span>
        ${maxNote}
      </div>
      <div class="streak-unit">日連続稽古</div>
      <div class="streak-milestones">${msHtml}</div>
      <div class="streak-msg">${msg}</div>
    </div>`;
}

/* ── Render ── */
function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';

  const count     = stampedDays.size;
  const completed = count >= 21;
  const rankId    = RANK_NAME_TO_ID[practiceData?.rank] || (completed ? 'jukyu' : 'minarai');
  const rank      = RANKS_BY_ID[rankId] || RANKS_BY_ID.minarai;

  document.getElementById('rank-mon').innerHTML = rank.mon;
  document.getElementById('rank-name').textContent = rank.name;
  document.getElementById('rank-sub').textContent  = rank.sub;
  document.getElementById('stamped-count').textContent = count;
  document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

  renderRankHistory();
  renderStreakHero();
  renderPentagonCompass();

  if (completed && startDate) {
    calYear  = startDate.getFullYear();
    calMonth = startDate.getMonth();
  } else {
    const now = new Date();
    calYear  = now.getFullYear();
    calMonth = now.getMonth();
  }
  renderCalendar();

  if (completed) {
    showCompletion();
  } else if (todayDay >= 1 && todayDay <= 21) {
    renderReflection(todayDay);
  } else {
    document.getElementById('reflection-area').innerHTML = `
      <div class="already-stamped">
        <div style="font-size:.8rem;color:var(--muted)">LINEのメッセージのリンクから<br>今日の稽古を記録してください。</div>
      </div>`;
  }
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth + 1}月`;

  const firstDay   = new Date(calYear, calMonth, 1);
  const lastDay    = new Date(calYear, calMonth + 1, 0);
  const startDow   = firstDay.getDay();
  const todayStr   = dateToStr(new Date());
  const periodStartStr = startDate ? dateToStr(startDate)          : null;
  const periodEndStr   = startDate ? dateToStr(addDays(startDate, 20)) : null;
  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  let html = '';
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell"></div>`;

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dow     = (startDow + d - 1) % 7;
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const inPeriod   = periodStartStr && dateStr >= periodStartStr && dateStr <= periodEndStr;
    const entry      = dateEntryMap[dateStr];
    const isCompleted = !!entry;
    const isTodayPractice = dateStr === todayPracticeStr;
    const isSelected = dateStr === selectedDateStr;
    const isPast     = dateStr < todayStr;

    let dayNum = null;
    if (inPeriod && startDate) {
      dayNum = Math.round((localDate(dateStr) - startDate) / 86400000) + 1;
    }

    let icon = '';
    if (isCompleted && dayNum && dayNum % 7 === 0) {
      icon = `<div class="cal-icon"><span class="cal-star">⭐</span></div>`;
    } else if (isCompleted) {
      icon = `<div class="cal-icon"><div class="cal-check">✓</div></div>`;
    } else if (isTodayPractice) {
      icon = `<div class="cal-icon"><div class="cal-dot gold-dot"></div></div>`;
    } else if (inPeriod && isPast) {
      icon = `<div class="cal-icon"><div class="cal-dot gray-dot"></div></div>`;
    }

    let cls = 'cal-cell';
    if (!inPeriod) cls += ' out-period';
    else {
      cls += ' in-period';
      if (isCompleted)                        cls += ' completed';
      if (isTodayPractice && !isCompleted)    cls += ' today-unrecorded';
      if (isSelected)                         cls += ' selected';
    }
    if (dow === 0) cls += ' sun-col';
    if (dow === 6) cls += ' sat-col';

    const click = inPeriod ? `onclick="selectCalDate('${dateStr}',${dayNum})"` : '';
    html += `<div class="${cls}" ${click}>
      <span class="cal-num">${d}</span>${icon}
    </div>`;
  }

  const totalCells = startDow + lastDay.getDate();
  const rem = totalCells % 7;
  if (rem) for (let i = 0; i < 7 - rem; i++) html += `<div class="cal-cell"></div>`;

  document.getElementById('cal-grid').innerHTML = html;
}

function selectCalDate(dateStr, dayNum) {
  selectedDateStr = dateStr;
  renderCalendar();

  const entry = dateEntryMap[dateStr];
  const d = localDate(dateStr);
  const DOW = ['日','月','火','水','木','金','土'];
  const label = `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;

  const wrap = document.getElementById('day-detail-wrap');
  const area = document.getElementById('day-detail-area');

  const todayPracticeStr = (todayDay >= 1 && startDate)
    ? dateToStr(addDays(startDate, todayDay - 1)) : null;

  // Today's practice day → scroll to form
  if (dateStr === todayPracticeStr && !entry) {
    wrap.style.display = 'none';
    document.getElementById('reflection-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }

  wrap.style.display = '';

  if (entry) {
    const savedMemo = (practiceData.memos || {})[String(dayNum)]?.text || '';
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span class="done-badge">✓ Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text">
          ${entry.text ? escHtml(entry.text).replace(/\n/g,'<br>') : '<span style="color:var(--muted)">（振り返りの記録なし）</span>'}
        </div>
        ${savedMemo ? `
          <div style="margin-top:.75rem;padding:.55rem .75rem;background:var(--bg3);border-radius:6px">
            <div style="font-size:.6rem;color:var(--muted);letter-spacing:.1em;margin-bottom:.2rem">自分用メモ</div>
            <div style="font-size:.78rem;color:var(--muted);line-height:1.6">${escHtml(savedMemo).replace(/\n/g,'<br>')}</div>
          </div>` : ''}
      </div>`;
  } else {
    const isPast = dateStr < dateToStr(new Date());
    area.innerHTML = `
      <div class="day-detail-card fade-up">
        <div class="day-detail-hd">
          <span class="day-detail-date">${label}</span>
          <span style="font-size:.68rem;color:var(--muted)">Day ${dayNum}</span>
        </div>
        <div class="day-reflection-text" style="color:var(--muted)">
          ${isPast ? 'この日の記録はありません。' : '稽古の日を楽しみに。'}
        </div>
      </div>`;
  }

  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCalendar();
}

/* ── Reflection form ── */
function renderReflection(day) {
  const area = document.getElementById('reflection-area');
  const savedMemo = (practiceData.memos || {})[String(day)]?.text || '';

  if (stampedDays.has(day)) {
    const entry = (practiceData.entries || []).find(e => e.day === day);
    const spiritKey = liteSpirit || null;
    const tip = spiritKey ? (TIPS_COMPACT[spiritKey] || [])[day - 1] : null;
    const musashiRepliesDay = (practiceData.musashiReplies || {})[String(day)];
    // adminComments にその日のコメントがあれば reply として扱う（後方互換）
    const adminComment = (practiceData.adminComments || []).filter(c => Number(c.day) === day).slice(-1)[0];
    const replies = musashiRepliesDay?.reply
      ? musashiRepliesDay
      : adminComment
        ? { reply: adminComment.text, ...(musashiRepliesDay || {}) }
        : null;

    const challengeBlock = tip ? `
      <div class="conv-block conv-challenge">
        <div class="conv-label">今日の課題</div>
        <div style="font-weight:600;margin-bottom:.22rem;color:var(--cream)">${escHtml(tip.t)}</div>
        <div style="color:var(--cream2)">${escHtml(tip.a)}</div>
      </div>` : '';

    const participantBlock = entry?.text ? `
      <div class="conv-block conv-participant">
        <div class="conv-label">あなたの記録</div>
        <div style="color:var(--cream2)">${escHtml(entry.text).replace(/\n/g,'<br>')}</div>
      </div>` : '';

    let musashiSection = '';
    if (replies?.reply) {
      const musashiFirstBlock = `
        <div class="conv-block conv-musashi">
          <div class="conv-label">⚔ 武蔵より</div>
          <div style="color:var(--cream2)">${escHtml(replies.reply).replace(/\n/g,'<br>')}</div>
        </div>`;
      if (!replies.followUpText) {
        musashiSection = musashiFirstBlock + `

          <div class="conv-label">やったことを報告する</div>
          <div style="font-size:.75rem;color:var(--muted);margin-bottom:.5rem">武蔵の言葉を受けて、実際に行動したことを教えてください。どんな小さなことでも構いません。</div>
          <textarea class="reflection-textarea" id="followup-text-${day}" rows="3" placeholder="例：一拍おいてから返事をするようにしました。"></textarea>

        </div>`;
      } else {

  }

  area.innerHTML = `
    <div class="reflection-card fade-up">
      <div class="reflection-day-label">DAY ${day} · 今日の気づき</div>
      <div class="reflection-title">稽古の振り返り</div>
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:.5rem">ファシリテーターに届きます</div>
      <textarea class="reflection-textarea" id="reflection-text"
        placeholder="今日の稽古から何を感じましたか？どんな小さな気づきでも構いません。" rows="4"></textarea>
      <button class="btn-submit" id="submit-btn" onclick="submitPractice(${day})">
        ⚔️ 稽古を記録する
      </button>
    </div>
    ${memoBlock(day, savedMemo)}`;
}

function memoBlock(day, savedText) {
  return `
    <div class="reflection-card fade-up" style="margin-top:.9rem;border-color:rgba(201,168,76,.1)">
      <div class="reflection-day-label">自分用メモ</div>
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:.55rem">あなただけが見るメモです。ファシリテーターには届きません。</div>
      <textarea class="reflection-textarea" id="memo-text" rows="3"
        placeholder="気づき、感情、アイデア、なんでも。">${escHtml(savedText)}</textarea>
      <button class="btn-submit" id="memo-btn" onclick="saveMemo(${day})"
        style="margin-top:.65rem;background:linear-gradient(135deg,#2a3a2a,#3a5a3a)">
        📝 メモを保存する
      </button>
      <div id="memo-result" style="text-align:center;font-size:.78rem;margin-top:.45rem;color:var(--muted)"></div>
    </div>`;
}

/* ── Save memo ── */
async function saveMemo(day) {
  const text   = document.getElementById('memo-text')?.value ?? '';
  const btn    = document.getElementById('memo-btn');
  const result = document.getElementById('memo-result');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    await db.collection('practices').doc(userId).set({
      memos: { [String(day)]: { text, updatedAt: new Date().toISOString() } }
    }, { merge: true });
    if (!practiceData.memos) practiceData.memos = {};
    practiceData.memos[String(day)] = { text };
    result.style.color = 'var(--gold)';
    result.textContent = '✓ 保存しました';
    setTimeout(() => { result.textContent = '' }, 2500);
  } catch(e) {
    console.error(e);
    result.style.color = 'var(--red)';
    result.textContent = '保存に失敗しました';
  } finally {
    btn.disabled = false; btn.textContent = '📝 メモを保存する';
  }
}

/* ── Stamp Animation ── */
function showStampAnimation(day, isComplete) {
  const el = document.createElement('div');
  el.className = 'stamp-overlay';
  el.innerHTML = `
    <div class="stamp-circle">
      <div class="stamp-ring" style="--d:.1s"></div>
      <div class="stamp-ring" style="--d:.25s"></div>
      <div class="stamp-ring" style="--d:.4s"></div>
      <div class="stamp-icon">${isComplete ? '🏆' : '⚔️'}</div>
      <div class="stamp-label">Day ${day}${isComplete ? ' — 入門完了' : ' — 完了'}</div>
    </div>`;
  document.body.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 600);
  }, 1200);
}

/* ── Submit practice ── */
async function submitPractice(day) {
  const textEl = document.getElementById('reflection-text');
  const text   = textEl?.value?.trim() || '';
  const btn    = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '記録中...' }

  const entry = { day, text, timestamp: new Date().toISOString(), cycle: practiceData.cycle || 1 };

  try {
    await db.collection('practices').doc(userId).set({
      lineUserId: userId,
      cycle: practiceData.cycle || 1,
      entries: firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });

    stampedDays.add(day);
    if (!practiceData.entries) practiceData.entries = [];
    practiceData.entries.push({ ...entry, timestamp: new Date() });

    // Rebuild date map with new entry
    buildDateEntryMap();

    const count = stampedDays.size;
    document.getElementById('stamped-count').textContent = count;
    document.getElementById('progress-fill').style.width = `${Math.min(count / 21 * 100, 100)}%`;

    renderCalendar();
    renderStreakHero();

    const isComplete = count >= 10;
    showStampAnimation(day, isComplete);

    if (isComplete) {
      await db.collection('practices').doc(userId).set({ rank: '十級' }, { merge: true });
      practiceData.rank = '十級';
      setTimeout(showCompletion, 1800);
    } else {
      setTimeout(() => renderReflection(day), 400);
    }
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '⚔️ 稽古を記録する' }
    alert('記録に失敗しました。もう一度お試しください。');
  }
}

/* ── Follow-up catch-ball ── */
async function submitFollowUp(day) {
  const text = (document.getElementById(`followup-text-${day}`)?.value || '').trim();
  if (!text) { alert('報告する内容を入力してください。'); return; }
  const btn    = document.getElementById(`followup-btn-${day}`);
  const result = document.getElementById(`followup-result-${day}`);
  if (btn) { btn.disabled = true; btn.textContent = '送信中...' }
  try {
    const res = await fetch(FOLLOW_UP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, day, text })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
    if (!practiceData.musashiReplies) practiceData.musashiReplies = {};
    if (!practiceData.musashiReplies[String(day)]) practiceData.musashiReplies[String(day)] = {};
    practiceData.musashiReplies[String(day)].followUpText = text;
    practiceData.musashiReplies[String(day)].musashiFollowUp = data.musashiFollowUp || '';
    renderReflection(day);
  } catch(e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = '⚔️ 武蔵に報告する' }
    if (result) { result.style.color = 'var(--red)'; result.textContent = '送信に失敗しました。もう一度お試しください。' }
  }
}

/* ── Completion ── */
function showCompletion() {
  document.getElementById('completion-screen').innerHTML = `
    <div class="fade-up">
      <div class="completion-mon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#c9a84c" stroke-width="3"/>
          <circle cx="50" cy="50" r="38" stroke="#c9a84c" stroke-width="1" opacity=".4"/>
          <circle cx="50" cy="50" r="30" stroke="#c9a84c" stroke-width="1" opacity=".2"/>
          <text x="50" y="65" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a84c" font-weight="bold">十</text>
        </svg>
      </div>
      <div class="completion-title">21日の鍛錬、完了。</div>
      <div class="completion-rank">十 級</div>
      <div class="completion-divider"></div>
      <div class="completion-desc">
        あなたは続けた。<br>それだけで、すでに侍だ。<br><br>
        道場への入門を果たし、<br>修行の道が正式に始まります。
      </div>
      <div style="margin-top:1.4rem">
        <a href="report.html?lid=${userId}" style="display:inline-block;font-size:.84rem;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,.4);padding:.5rem 1.3rem;border-radius:100px;background:rgba(201,168,76,.08)">
          📜 21日間の記録を見る
        </a>
      </div>
    </div>`;
  document.getElementById('completion-screen').classList.add('visible');
  document.getElementById('reflection-area').innerHTML = '';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error-screen').style.display = 'block';
  document.getElementById('error-msg').innerHTML = msg;
}

init();
</script>
</body>
</html>
